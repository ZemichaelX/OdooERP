services:
  db:
    # Pinned by DIGEST (R7), same as ci.yml: the 16 tag is rebuilt upstream
    # continuously. Upgrading the image is a deliberate, tested change — bump
    # this digest in its own PR and let the CI integration suite prove it.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
    volumes:
      - ../addons:/mnt/extra-addons:ro
      # Runtime copy of config/odoo.conf (gitignored — holds admin_passwd).
      # Created by scripts/provision_client.sh, or by hand:
      #   cp config/odoo.conf config/odoo.runtime.conf
      - ../config/odoo.runtime.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  pgdata:
  odoo-data:
