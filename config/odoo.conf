[options]
; Custom addons first, then Odoo's bundled addons.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Security / production hardening ---
; NOTE: Odoo does NOT expand environment variables in this file. Set admin_passwd
; per deployment (scripts/provision_client.sh writes the real value from the env);
; never commit a real master password here.
; Set list_db = False in production.
list_db = True
; Behind Nginx/TLS.
proxy_mode = True

; --- Performance (tune per server) ---
workers = 2
limit_time_cpu = 120
limit_time_real = 240
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
