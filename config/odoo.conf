[options]
; Custom addons first, then Odoo's bundled addons.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Security / production hardening ---
; Set admin_passwd from a secret in production; keep DB listing off.
admin_passwd = ${ODOO_ADMIN_PASSWD}
list_db = True            ; set False in production
proxy_mode = True         ; behind Nginx/TLS

; --- Performance (tune per server) ---
workers = 2
limit_time_cpu = 120
limit_time_real = 240
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
