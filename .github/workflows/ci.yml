name: CI

on:
  # `push` stays master-only: every other branch is covered by `pull_request`,
  # so running both would execute the whole suite twice for one change.
  push:
    branches: [master]
    paths-ignore: &paths_ignore
      # A docs-only change cannot alter any test outcome. Six jobs, five of them
      # booting Odoo against Postgres, is a lot of machine time to spend proving
      # that editing a paragraph did not break the payroll engine.
      - 'docs/**'
      - '*.md'
      # ...but never skip these two. CLAUDE.md is matched by `*.md` and is the
      # rulebook, not prose; and a change to the workflows is the thing most in
      # need of running. (`.github/workflows/**` is matched by neither pattern
      # above, so that line is belt-and-braces rather than load-bearing.)
      - '!CLAUDE.md'
      - '!.github/workflows/**'
  pull_request:
    # Branches deliberately unrestricted — every branch's PR must run.
    paths-ignore: *paths_ignore

# A superseded run is queue time in front of the run somebody is actually
# waiting on. Keyed on the ref, so a push to master never cancels a PR's run
# and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Inert on a GitHub-hosted runner, which gets a fresh filesystem per job.
  # Load-bearing on the self-hosted fallback, which does not: five jobs here run
  # their container as `--user root` with Odoo's addons-path pointed at
  # ${GITHUB_WORKSPACE}, and CPython writes __pycache__/*.pyc next to the source
  # as root into the bind-mounted host workspace. Kept so that switching back to
  # the self-hosted runner is one edit, not two.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint-and-fast-tests:
    name: Lint + reference golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --quiet ruff black pylint pylint-odoo pytest python-dateutil

      - name: The vendor guard still discriminates
        # scripts/lint.sh runs the vendor integrity check itself, so a developer
        # who edits vendored code is stopped at pre-push rather than here. What
        # is CI-only is the SELF-TEST: it breaks the vendored tree on purpose,
        # four ways, and requires the check to go red each time before restoring
        # it. That mutates the working tree, which is fine on a throwaway runner
        # and rude on someone's laptop mid-push.
        #
        # It runs BEFORE the check it is proving, so a guard that had quietly
        # stopped discriminating fails here rather than waving the real check
        # through.
        run: ./scripts/check_vendor.sh --self-test


      - name: The deploy script's guards still discriminate
        # scripts/update_local.sh is the one command that deploys master to the
        # operator's tenant, and every check in it is a claim about a silent
        # failure. --self-test makes each claim false on purpose and requires
        # the script to go red for THAT REASON, not merely to exit non-zero.
        #
        # It needs no Docker and no database: each case drives the script with a
        # stub Odoo against a throwaway git repository it builds itself.
        run: bash scripts/update_local.sh --self-test
      - name: The launcher verifier still refuses to report what it did not measure
        # check_launcher.py emits `launcher_measured=0` and prints NOTHING
        # downstream when the fetch of /odoo does not reach the backend, and
        # verify_launcher turns that into ONE "could not measure" error instead
        # of the six alarms an operator spent an evening on.
        #
        # Both halves are proved by making the bad thing happen on purpose: the
        # Python half execs the real file against a stub client serving the
        # website login page, the shell half drives verify_launcher with canned
        # transcripts. Each also proves the guard STAYS OPEN on a real
        # measurement, because a gate that never opens would pass too. No
        # Docker, no database.
        run: |
          set -euo pipefail
          python3 scripts/check_launcher_selftest.py
          bash scripts/check_launcher_guard_selftest.sh

      - name: Lint (ruff, black, pylint-odoo)
        # ONE DEFINITION, shared with the pre-push hook: .githooks/pre-push runs
        # this same script. Both the floors ("is there anything to lint at all")
        # and the three tools live in it, and it gates on EXIT CODES.
        #
        # It replaces three separate `run:` steps plus a floors step. Those were
        # not wrong, but they were a second definition of lint that a developer
        # could not run, and the gap showed: a pylint warning that a local run
        # had already produced reached CI, because the local check read pylint's
        # "rated at 10.00/10" instead of its exit status of 4.
        run: bash scripts/lint.sh

      - name: Reference calculator golden tests (no Odoo needed)
        # pytest exits 5 when it collects NOTHING, so the total-wipe case is
        # already covered. The floor catches the partial one: a renamed test
        # module or a broken import taking most of the suite with it still
        # reports "12 passed" and exits 0.
        run: |
          set -euo pipefail
          MIN_FAST_TESTS=300   # 308 at this commit
          pytest tests_fast/ -q | tee /tmp/fast-tests.log
          passed=$(grep -oE '[0-9]+ passed' /tmp/fast-tests.log | tail -1 | grep -oE '^[0-9]+' || true)
          passed=${passed:-0}
          echo "Fast golden tests passed: ${passed} (floor ${MIN_FAST_TESTS})"
          if [ "${passed}" -lt "${MIN_FAST_TESTS}" ]; then
            echo "::error::Only ${passed} fast tests passed, expected at least ${MIN_FAST_TESTS}. The suite did not run — this is a failure, not a pass."
            exit 1
          fi

      - name: Validate XML, CSV and manifests
        run: |
          python - <<'EOF'
          import ast
          import csv
          import glob
          import xml.etree.ElementTree as ET

          # Count what was actually validated and report it. "OK" printed after
          # looping over an empty glob is a success signal produced by doing
          # nothing — the exact shape this repo keeps getting caught by.
          MIN_XML, MIN_CSV, MIN_MANIFESTS = 30, 5, 5   # 46 / 9 / 9 at this commit

          xml_count = 0
          for path in glob.glob("addons/**/*.xml", recursive=True):
              ET.parse(path)
              xml_count += 1
          csv_count = 0
          for path in glob.glob("addons/**/*.csv", recursive=True):
              with open(path, newline="", encoding="utf-8") as handle:
                  widths = {len(row) for row in csv.reader(handle)}
                  assert len(widths) == 1, f"ragged CSV: {path}"
              csv_count += 1
          manifest_count = 0
          for path in glob.glob("addons/*/__manifest__.py"):
              with open(path, encoding="utf-8") as handle:
                  ast.literal_eval(handle.read())
              manifest_count += 1

          print(f"validated {xml_count} XML, {csv_count} CSV, {manifest_count} manifests")
          assert xml_count >= MIN_XML, f"only {xml_count} XML files validated (floor {MIN_XML})"
          assert csv_count >= MIN_CSV, f"only {csv_count} CSV files validated (floor {MIN_CSV})"
          assert manifest_count >= MIN_MANIFESTS, (
              f"only {manifest_count} manifests validated (floor {MIN_MANIFESTS})"
          )
          print("XML/CSV/manifests OK")
          EOF

  integration-tests:
    name: Odoo integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run inside the same Odoo 19 image production uses, so the suite exercises
    # the real ORM/registry/report stack (A3). A DB failure here fails CI.
    # Images are pinned by DIGEST (R7): the 19.0/16 tags are rebuilt upstream
    # continuously, and an unannounced rebuild silently changed core behaviour
    # under us once already. Upgrading an image is a deliberate, tested change
    # — bump the digest in its own PR and let this suite prove it.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the Odoo integration suites (with demo data)
        # The odoo:19.0 image's default shell is dash (no `pipefail`); force
        # bash, whose GitHub wrapper already runs with `-eo pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          # Install the two demo tenants: they pull in every product module
          # (sapian_core, l10n_et_base/payroll/reports, vertical_pharma) so
          # --test-enable runs the whole suite. --workers=0 is required for the
          # HttpCase web tests. A failing test makes odoo exit non-zero → CI red.
          #
          # web_responsive is installed because it is now in the shipped default
          # set (scripts/provision_client.sh) and in the demo build, so the
          # suite must run against the stack a client actually gets. Its OWN
          # tests are deliberately NOT in --test-tags below: with `account`
          # installed, its at_install TestResUsers errors in setUpClass before
          # running (it loads at 39/82, before account, and hits a NOT NULL
          # autopost_bills) — diagnosed in vendor/README.md. Upstream's tests
          # are run by the launcher-defaults job, where the module is loaded on
          # its own terms.
          #
          # sapian_dress_rehearsal is here because it was NOT, and that is how
          # its provisioner stayed broken for a week: scripts/dress_rehearsal.sh
          # is run by hand, CI never touched the module, and the one guard that
          # could have caught it did not exist. It is an internal QA module and
          # never ships to a client (scripts/check_no_demo_modules.sh enforces
          # that separately); installing it on a scratch CI database is free.
          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_test \
            -i sapian_demo_trader,sapian_demo_pharma,sapian_theme,sapian_theme_mail,sapian_theme_auth_signup,web_responsive,sapian_dress_rehearsal,l10n_et_calendar,l10n_et_calendar_account,l10n_et_calendar_purchase,sapian_landing \
            --test-enable \
            --test-tags '/sapian_core,/l10n_et_base,/l10n_et_payroll,/l10n_et_reports,/vertical_pharma,/sapian_demo_trader,/sapian_demo_pharma,/sapian_theme,/sapian_theme_mail,/sapian_theme_auth_signup,/sapian_dress_rehearsal,/l10n_et_calendar,/l10n_et_calendar_account,/l10n_et_calendar_purchase,/sapian_landing' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/odoo-test.log
          # `set -o pipefail` already makes a non-zero odoo exit fail this step.
          # Belt and braces: also fail on Odoo's own result line reporting any
          # failed or errored test (matches "N failed" or "0 failed, N error(s)"
          # but not the clean "0 failed, 0 error(s)").
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/odoo-test.log; then
            echo "::error::Odoo integration tests reported failures"
            exit 1
          fi

          # A GREEN EXIT CODE IS NOT PROOF THAT ANYTHING RAN.
          # Every check above this line asks "did a test fail?" — and a run that
          # executes ZERO tests answers "no" to all of them. That is not a
          # hypothetical: it happened locally, where a failed database drop left
          # the modules already installed, so `-i` was a no-op, `--test-enable`
          # had nothing to select, 10 tests ran instead of 222, and the command
          # exited 0. The only tell was an empty stats block. In CI the same
          # shape can come from a renamed module, a typo in --test-tags, or an
          # install that silently does nothing.
          #
          # So assert the positive: the runner reported, and it ran a full suite.
          if ! grep -q "odoo\.tests\.result:" /tmp/odoo-test.log; then
            echo "::error::The Odoo test runner never reported a result line — no tests were executed. A suite that runs nothing must not report success."
            exit 1
          fi
          # MIN_EXPECTED_TESTS is a FLOOR, not the exact count (418 at this
          # commit, after the social welfare levy).
          # Raise it as the suite grows. Only ever
          # lower it in a commit that says which tests went away and why —
          # lowering it to make CI pass is how this guard gets quietly disabled.
          #
          # NOTE: this job has no browser, so the app rail's browser_js tests
          # skip here. They are covered by the `rail-render` job, which installs
          # Chrome and fails if the browser did not actually report.
          #
          # Raised 350 -> 365 when sapian_theme_mail landed with 15 tests,
          # 365 -> 371 when its Settings-UI tests took it to 21, and
          # 371 -> 385 when sapian_theme_auth_signup landed with 14, and
          # 385 -> 400 when the profit & loss statement landed with 15 in
          # l10n_et_reports (27 -> 42), 400 -> 418 when the balance sheet took
          # it to 60, 418 -> 454 when the SapianBot rename took
          # sapian_theme_mail to 68, and 454 -> 462 when the demo's books grew
          # nine tests that read the statements back. The floor
          # is what stops a module's suite going missing quietly, so it has to
          # move with the suite. Measured, not guessed: run 32232939918 summed
          # 632 across its module stats lines, of which sapian_theme_mail is 68
          # — a floor left at 418 would not have noticed that module vanishing.
          MIN_EXPECTED_TESTS=462
          EXECUTED=$(grep -oE "odoo\.tests\.stats: [A-Za-z0-9_]+: [0-9]+ tests" /tmp/odoo-test.log \
                     | awk '$4 == "tests" { total += $3 } END { print total + 0 }')
          echo "Executed ${EXECUTED} tests (floor ${MIN_EXPECTED_TESTS}):"
          grep -oE "odoo\.tests\.stats: [A-Za-z0-9_]+: [0-9]+ tests" /tmp/odoo-test.log | sed 's/^/  /'
          if [ "${EXECUTED}" -lt "${MIN_EXPECTED_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} tests executed, expected at least ${MIN_EXPECTED_TESTS}. The suite did not run — this is a failure, not a pass."
            exit 1
          fi

          # AND A FLOOR FOR THE MAIL BRIDGES SPECIFICALLY, because the total
          # above cannot see them go missing. The suite is ~430 tests here; if
          # all 14 password-reset tests vanished the total would still clear
          # 385 comfortably and this job would stay green while the only
          # coverage of a customer-facing email disappeared. A per-module floor
          # is the only thing that notices.
          #
          # These two are singled out rather than every module because they are
          # the ones whose subject nobody looks at: an unbranded email is
          # invisible from inside the product, and both of these modules exist
          # because it stayed invisible for months.
          #
          # The floors are deliberately well under the measured figures — 68 and
          # 22 on a database with website and account installed. A floor is here
          # to notice a suite GOING MISSING, not to track its size, and one set
          # a test or two below today's count is a floor that has to be edited
          # every time somebody adds a case.
          #
          # sapian_theme_mail's floor moves 20 -> 40 with this version. It was
          # set when the module had 33 tests; the SapianBot rename takes it to
          # 68, and a floor left at 20 would sit at under a third of the suite —
          # far enough under to let most of it disappear and still report OK,
          # which is the failure the floor exists to prevent rather than a
          # tolerance it is meant to allow.
          for pair in "sapian_theme_mail:40" "sapian_theme_auth_signup:12"; do
            MODULE="${pair%%:*}"; FLOOR="${pair##*:}"
            RAN=$(grep -oE "odoo\.tests\.stats: ${MODULE}: [0-9]+ tests" /tmp/odoo-test.log \
                  | grep -oE "[0-9]+ tests" | grep -oE "^[0-9]+" || echo 0)
            echo "Executed ${RAN} ${MODULE} tests (floor ${FLOOR})"
            if [ "${RAN}" -lt "${FLOOR}" ]; then
              echo "::error::Only ${RAN} ${MODULE} tests ran; expected at least ${FLOOR}. The mail branding is untested, so a green result means nothing."
              exit 1
            fi
          done

  calendar-standalone:
    name: Calendar installs, and uninstalls, alone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WHY A SEPARATE JOB.
    #
    # l10n_et_calendar's central claim is that it stands ALONE: a client who
    # wants Ethiopian dates on a purchase order must not be handed a chart of
    # accounts with them. The integration job installs it beside every other
    # module we ship, so it cannot tell the difference between "depends on base
    # and base_setup" and "happens to work because l10n_et_base was already
    # there". This job installs it on a database that has nothing else of ours
    # on it at all.
    #
    # It also exercises UNINSTALL. An uninstall that leaves columns behind is
    # invisible until a client asks to remove the module, which is exactly when
    # nobody wants to be debugging.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install alone, run its tests, uninstall, reinstall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          # Flags only, so the same set can be handed to `odoo` and to
          # `odoo shell` (the subcommand has to come first).
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          # 1. install alone, with its tests
          odoo ${ARGS} -d ci_calendar -i l10n_et_calendar \
            --test-enable --test-tags '/l10n_et_calendar' \
            --log-level=test 2>&1 | tee /tmp/calendar.log

          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/calendar.log; then
            echo "::error::l10n_et_calendar tests failed."
            exit 1
          fi
          # A GREEN EXIT CODE IS NOT PROOF THAT ANYTHING RAN. Assert the count.
          MIN_CALENDAR_TESTS=25          # 27 at this commit
          EXECUTED=$(grep -oE "odoo\.tests\.stats: l10n_et_calendar: [0-9]+ tests" /tmp/calendar.log \
                     | grep -oE "[0-9]+ tests" | grep -oE "[0-9]+" | tail -1 || echo 0)
          echo "Executed ${EXECUTED} calendar tests (floor ${MIN_CALENDAR_TESTS})"
          if [ "${EXECUTED}" -lt "${MIN_CALENDAR_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} calendar tests executed — the suite did not run."
            exit 1
          fi

          # 2. nothing else of ours came along for the ride. Asserted against
          #    the database, not the manifest: ir_module_module knows what is
          #    actually installed. The marker is printed by the shell itself,
          #    so an odoo shell that died before running anything cannot pass
          #    this by producing no output.
          echo 'print("SAPIAN-CAL others=%s" % sorted(n for n in env["ir.module.module"].search([("state","=","installed")]).mapped("name") if n.startswith(("sapian_", "l10n_et_"))))' \
            | odoo shell ${ARGS} -d ci_calendar --log-level=warn 2>&1 | tee /tmp/calendar-alone.log
          grep -q "SAPIAN-CAL others=" /tmp/calendar-alone.log \
            || { echo "::error::The odoo shell never reported — the standalone check ran nothing."; exit 1; }
          if ! grep -q "SAPIAN-CAL others=\['l10n_et_calendar'\]" /tmp/calendar-alone.log; then
            echo "::error::l10n_et_calendar is not alone on this database:"
            grep "SAPIAN-CAL others=" /tmp/calendar-alone.log
            exit 1
          fi

          # 3. uninstall, and prove the columns went with it
          echo 'env["ir.module.module"].search([("name","=","l10n_et_calendar")]).button_immediate_uninstall(); env.cr.commit()' \
            | odoo shell ${ARGS} -d ci_calendar --log-level=warn 2>&1 | tail -3
          echo 'env.cr.execute("SELECT column_name FROM information_schema.columns WHERE table_name = %s", ("res_company",)); print("SAPIAN-CAL leftover=%d" % len([c for (c,) in env.cr.fetchall() if c.startswith("l10n_et_")])); env.cr.execute("SELECT state FROM ir_module_module WHERE name = %s", ("l10n_et_calendar",)); print("SAPIAN-CAL state=%s" % env.cr.fetchone()[0])' \
            | odoo shell ${ARGS} -d ci_calendar --log-level=warn 2>&1 | tee /tmp/calendar-uninstall.log
          grep -E "SAPIAN-CAL (leftover|state)=" /tmp/calendar-uninstall.log | sed 's/^/  /'
          grep -q "SAPIAN-CAL state=uninstalled" /tmp/calendar-uninstall.log \
            || { echo "::error::The module did not reach state 'uninstalled'."; exit 1; }
          grep -q "SAPIAN-CAL leftover=0" /tmp/calendar-uninstall.log \
            || { echo "::error::Uninstall left l10n_et_ columns behind on res_company."; exit 1; }

          # 4. and it goes back on afterwards
          odoo ${ARGS} -d ci_calendar -i l10n_et_calendar \
            --test-enable --test-tags '/l10n_et_calendar' \
            --log-level=test 2>&1 | tee /tmp/calendar-again.log
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/calendar-again.log; then
            echo "::error::l10n_et_calendar failed on reinstall."
            exit 1
          fi
          grep -q "odoo\.tests\.stats: l10n_et_calendar: " /tmp/calendar-again.log \
            || { echo "::error::No calendar tests ran on reinstall."; exit 1; }

      - name: A bridge appears only when BOTH its sides are present
        shell: bash
        # auto_install is a claim about what happens on somebody else's
        # database, and "it worked on mine" is not evidence: the interesting
        # case is the one where a bridge appears where it should not, on a
        # client who installed Accounting and never asked for a calendar.
        #
        # So this walks the three states on a separate database and asserts the
        # module states at each one, rather than asserting the manifests say
        # auto_install: True — which they would say either way.
        run: |
          set -euo pipefail
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"
          PROBE='print("SAPIAN-BRIDGE " + " ".join("%s=%s" % (m.name, m.state) for m in env["ir.module.module"].search([("name","in",["account","purchase","l10n_et_calendar","l10n_et_calendar_account","l10n_et_calendar_purchase"])], order="name")))'

          expect () {   # expect <label> <expected SAPIAN-BRIDGE line>
            echo "${PROBE}" | odoo shell ${ARGS} -d ci_bridges --log-level=warn 2>&1 \
              | tee /tmp/bridge.log >/dev/null
            grep -q "SAPIAN-BRIDGE " /tmp/bridge.log \
              || { echo "::error::[$1] the shell never reported — nothing was checked."; exit 1; }
            ACTUAL=$(grep -o "SAPIAN-BRIDGE .*" /tmp/bridge.log | tail -1)
            echo "  [$1] ${ACTUAL}"
            if [ "${ACTUAL}" != "$2" ]; then
              echo "::error::[$1] expected: $2"
              exit 1
            fi
          }

          # 1. Accounting, and no calendar: neither bridge may appear.
          odoo ${ARGS} -d ci_bridges -i account --log-level=warn
          expect "account alone" "SAPIAN-BRIDGE account=installed l10n_et_calendar=uninstalled l10n_et_calendar_account=uninstalled l10n_et_calendar_purchase=uninstalled purchase=uninstalled"

          # 2. Add the calendar: the INVOICE bridge appears by itself, and the
          #    purchase one stays away because purchase is not installed.
          odoo ${ARGS} -d ci_bridges -i l10n_et_calendar --log-level=warn
          expect "calendar added" "SAPIAN-BRIDGE account=installed l10n_et_calendar=installed l10n_et_calendar_account=installed l10n_et_calendar_purchase=uninstalled purchase=uninstalled"

          # 3. Add purchase: now the second bridge appears too.
          odoo ${ARGS} -d ci_bridges -i purchase --log-level=warn
          expect "purchase added" "SAPIAN-BRIDGE account=installed l10n_et_calendar=installed l10n_et_calendar_account=installed l10n_et_calendar_purchase=installed purchase=installed"

          # 4. Uninstall both bridges: their columns go with them, and the
          #    calendar itself is untouched.
          echo 'env["ir.module.module"].search([("name","in",["l10n_et_calendar_account","l10n_et_calendar_purchase"])]).button_immediate_uninstall(); env.cr.commit()' \
            | odoo shell ${ARGS} -d ci_bridges --log-level=warn 2>&1 | tail -3
          echo 'env.cr.execute("SELECT table_name, column_name FROM information_schema.columns WHERE table_name IN (%s, %s)", ("account_move", "purchase_order")); left = sorted(r for r in env.cr.fetchall() if r[1].startswith("l10n_et_")); print("SAPIAN-BRIDGE-UNINST leftover=%d %s" % (len(left), left))' \
            | odoo shell ${ARGS} -d ci_bridges --log-level=warn 2>&1 | tee /tmp/bridge-uninst.log | grep SAPIAN-BRIDGE-UNINST
          grep -q "SAPIAN-BRIDGE-UNINST leftover=0 " /tmp/bridge-uninst.log \
            || { echo "::error::Uninstalling a bridge left its columns behind."; exit 1; }
          expect "bridges removed" "SAPIAN-BRIDGE account=installed l10n_et_calendar=installed l10n_et_calendar_account=uninstalled l10n_et_calendar_purchase=uninstalled purchase=installed"

  theme-with-website:
    name: Theme login vs website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WHY A SEPARATE JOB.
    #
    # sapian_theme's login branding is template inheritance on
    # web.login_layout / web.login — layouts other modules also inherit. The
    # `website` module replaces the whole login card at priority 20, and when it
    # is installed our logo and support-contact line silently vanished. The
    # login tests PASSED in CI throughout, because CI never installed website:
    # the guard existed but was never exercised where the breakage happens.
    #
    # A guard that cannot fail in CI is not a guard. This job installs website
    # WITH sapian_theme and runs the login tests against that combination.
    #
    # Separate from integration-tests, not folded into it, for two reasons:
    #   1. it runs in PARALLEL, so the extra ~2 minutes of installing website do
    #      not lengthen the critical path;
    #   2. it is a distinct question with a distinct failure meaning — "the
    #      theme lost a contest with another module" is not "a test broke".
    #
    # This is NOT hypothetical coverage: website_sale is a plausible client
    # purchase (an Ethiopian retailer selling online) and it pulls website in.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Login branding survives `website`
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_theme_website \
            -i website,website_sale,sapian_theme --without-demo=all \
            --test-enable --test-tags '/sapian_theme:TestSapianThemeLogin,/sapian_theme:TestLoginPageAsAVisitor,/sapian_theme:TestAuthPagesAreOurs,/sapian_theme:TestAuthScopeDoesNotLeak,/sapian_theme_website' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/theme-website.log

          # website_sale IS THE CONDITION, not extra scenery. Its post-install
          # hook (website_sale/__init__.py:15) writes
          # auth_signup_uninvited='b2c' to every website, which is what opened
          # public sign-up on the product's own 36-app configuration while
          # `auth_signup.invitation_scope` still read b2b and the guard still
          # read the parameter. Installing `website` alone does NOT reproduce
          # it — the field defaults to b2b there — so this job proved nothing
          # about sign-up until website_sale was added to the list.
          if ! grep -qE "loading website_sale/" /tmp/theme-website.log; then
            echo "::error::website_sale was not loaded, so the condition that opens public sign-up was never created and the sapian_theme_website tests proved nothing."
            exit 1
          fi
          # And the bridge must have auto-installed. It is the only thing
          # holding sign-up closed; a run where it silently stayed uninstalled
          # would be green because nothing tested it.
          #
          # Asserted on "Loading module", not on "loading <module>/<file>.xml"
          # like the line above: the bridge ships NO data files, so it never
          # emits one. The first version of this check grepped for the latter
          # and reported the bridge missing on a run where it was installed and
          # its 13 tests had passed — a guard that would have failed every
          # green build.
          if ! grep -qE "Loading module sapian_theme_website" /tmp/theme-website.log; then
            echo "::error::sapian_theme_website did not auto-install alongside website. Public sign-up is open on this configuration and nothing noticed."
            exit 1
          fi

          # PROVE THE CONDITION WAS REALLY CREATED. Without this the job could
          # pass by running the login tests on a database where `website` failed
          # to install — green for the same reason the bug was invisible.
          if ! grep -qE "loading website/" /tmp/theme-website.log; then
            echo "::error::No sign that the website module was loaded. This job's whole purpose is testing WITH website installed; it proves nothing otherwise."
            exit 1
          fi

          # Assert the runner reported, and reported the expected suite.
          if ! grep -q "odoo\.tests\.result:" /tmp/theme-website.log; then
            echo "::error::The test runner never reported a result line — no tests were executed."
            exit 1
          fi
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/theme-website.log; then
            echo "::error::Login branding did NOT survive the website module."
            exit 1
          fi

          # A floor, so a renamed or removed test class cannot pass by selecting
          # nothing. TestSapianThemeLogin has 4 tests at this commit and
          # TestLoginPageAsAVisitor 9 — the latter is here because the
          # attribution, the sign-up link and the support line are anchored on
          # the login FORM precisely so they survive `website` replacing the
          # card, and this is the only job that proves it.
          # Raised 13 -> 20 when the auth-page tests landed: login, signup and
          # reset password are one surface now, and this is the only job that
          # serves them beside a real website.
          MIN_LOGIN_TESTS=20
          EXECUTED=$(grep -oE "odoo\.tests\.stats: sapian_theme: [0-9]+ tests" /tmp/theme-website.log \
                     | grep -oE "[0-9]+ tests" | grep -oE "^[0-9]+" || echo 0)
          echo "Executed ${EXECUTED} sapian_theme tests with website installed (floor ${MIN_LOGIN_TESTS})"
          if [ "${EXECUTED}" -lt "${MIN_LOGIN_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} tests ran; expected at least ${MIN_LOGIN_TESTS}. The selection is broken, so a green result means nothing."
            exit 1
          fi
          # The bridge's own floor, counted separately: a `/sapian_theme_website`
          # selector that matched nothing would leave the number above untouched.
          # Raised from 9 when test_login_chrome.py landed: the bridge stopped
          # being only about sign-up when it took on keeping the login page out
          # of the marketing site's header and footer.
          #
          # CALIBRATED, not counted. The number this reads is not the count of
          # `def test_` (15 at this commit); it was measured both ways on the
          # same install list — 13 with only test_public_signup registered, 25
          # with test_login_chrome as well. 20 therefore cannot be reached
          # unless the new file is actually selected, which is the whole job of
          # a floor, and leaves headroom under 25.
          MIN_BRIDGE_TESTS=22
          BRIDGE=$(grep -oE "odoo\.tests\.stats: sapian_theme_website: [0-9]+ tests" /tmp/theme-website.log \
                   | grep -oE "[0-9]+ tests" | grep -oE "^[0-9]+" || echo 0)
          echo "Executed ${BRIDGE} sapian_theme_website tests (floor ${MIN_BRIDGE_TESTS})"
          if [ "${BRIDGE}" -lt "${MIN_BRIDGE_TESTS}" ]; then
            echo "::error::Only ${BRIDGE} sign-up tests ran; expected at least ${MIN_BRIDGE_TESTS}."
            exit 1
          fi

      - name: The theme also installs, and passes, entirely ALONE
        shell: bash
        # THE OTHER END OF THE SAME QUESTION.
        #
        # The step above proves the theme survives a module arriving beside it.
        # This one proves it survives nothing arriving at all — which is the
        # configuration its own manifest claims ("must install on a database
        # that carries no other sapian module") and the one no job ran.
        #
        # That gap was not hypothetical. test_the_signup_check_discriminates
        # asserted the login page offers /web/signup at b2c, which is only true
        # when `auth_signup` is installed; on a theme-only database it failed.
        # It had been failing on master, unnoticed, because every job that runs
        # the login tests installs something that drags auth_signup in. The
        # assertion is now conditional on what is actually installed, and this
        # step is what keeps it honest.
        #
        # It is a step on this job rather than a job of its own because it needs
        # the same container and database service and takes about forty seconds
        # — a whole job's start-up cost to run one install would be the more
        # expensive choice.
        run: |
          set -euo pipefail
          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_theme_alone \
            -i sapian_theme --without-demo=all \
            --test-enable --test-tags '/sapian_theme' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/theme-alone.log

          if ! grep -q "odoo\.tests\.result:" /tmp/theme-alone.log; then
            echo "::error::The test runner never reported a result line — no tests were executed."
            exit 1
          fi
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/theme-alone.log; then
            echo "::error::sapian_theme does not pass its own tests when installed alone."
            exit 1
          fi

          # PROVE IT REALLY IS ALONE. Asserted against the database, not the
          # command line: `-i sapian_theme` is also what a database with half
          # the product already on it would show. Nothing of ours may be here
          # but the theme — and auth_signup must be ABSENT, since its presence
          # is what silently made this configuration look covered.
          odoo shell \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_theme_alone --no-http --stop-after-init --log-level=warn <<'PY' 2>&1 | tee /tmp/theme-alone-check.log
          names = env['ir.module.module'].search([('state', '=', 'installed')]).mapped('name')
          ours = sorted(n for n in names if n.startswith(('sapian_', 'l10n_et_')) or n == 'web_responsive')
          print('SAPIAN-ALONE ours=%s auth_signup=%s' % (ours, 'auth_signup' in names))
          PY
          grep -q "SAPIAN-ALONE ours=" /tmp/theme-alone-check.log \
            || { echo "::error::The odoo shell never reported — the alone check ran nothing."; exit 1; }
          grep "SAPIAN-ALONE " /tmp/theme-alone-check.log | sed 's/^/  /'
          if ! grep -q "SAPIAN-ALONE ours=\['sapian_theme'\] auth_signup=False" /tmp/theme-alone-check.log; then
            echo "::error::ci_theme_alone is not the configuration this step exists to cover."
            exit 1
          fi

          # And a floor, so a broken selection cannot pass by running nothing.
          MIN_ALONE_TESTS=40
          EXECUTED=$(grep -oE "odoo\.tests\.result: [0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests" /tmp/theme-alone.log \
                     | grep -oE "of [0-9]+ tests" | grep -oE "[0-9]+" | tail -1 || echo 0)
          EXECUTED=${EXECUTED:-0}
          echo "Executed ${EXECUTED} sapian_theme tests alone (floor ${MIN_ALONE_TESTS})"
          if [ "${EXECUTED}" -lt "${MIN_ALONE_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} tests ran alone; expected at least ${MIN_ALONE_TESTS}."
            exit 1
          fi

  rail-render:
    name: App rail rendered in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WHY A SEPARATE JOB — AND WHY IT INSTALLS A BROWSER.
    #
    # The app rail is an OWL component. `/odoo` serves a bootstrap shell, so
    # the rail exists in no HTML any HTTP client can fetch: grepping the page,
    # or the compiled bundle, proves nothing about whether it renders. That is
    # the same gap the login defect hid in — the SCSS said teal, the bundle
    # contained the brand seven times, and the button rendered Odoo purple.
    #
    # So this job drives real headless Chrome. The odoo:19.0 image ships
    # neither Chrome nor websocket-client, and `browser_js` SKIPS when either
    # is missing (odoo/tests/common.py:2153 and :1259) — a skip being a success
    # signal produced by doing nothing. scripts/install_test_browser.sh puts
    # both in place and fails loudly if it cannot, and the assertions at the
    # bottom of this job require the browser's own output in the log, so a
    # silently skipped run cannot come out green.
    #
    # Separate from integration-tests for the same two reasons as
    # theme-with-website: it runs in parallel so the browser install is off the
    # critical path, and "the rail did not render" is a different question from
    # "a test broke".
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install headless Chrome and websocket-client
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/install_test_browser.sh"

      - name: The rail and the backend footer render, and hide below md
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          # THE PRODUCT'S OWN APP COUNT, not a convenient one.
          #
          # This job used to install eight modules and get 14 root apps, and at
          # 14 apps EVERYTHING FITS: scrollHeight never exceeds clientHeight, so
          # the rail's scroll and truncation assertions were either forced
          # artificially (TestSapianAppRailOverflow sets a height) or vacuous
          # (RAIL_RENDERS_JS scrolled a rail with nothing to scroll and reported
          # lastReachableByScrolling=true, which it could not have failed).
          #
          # 14 apps is a configuration no client will ever run. We ship 36, and
          # 36 is where overflow, scrolling and truncation actually live —
          # measured, 19 of 36 visible without scrolling, the rail overflows
          # naturally. Both rail defects found on 2026-08-15 were about
          # behaviour at that scale and both were found by accident.
          #
          # The list is sapian.module.catalog's — the same set
          # `build_demo.sh --all-apps` installs — kept in sync by the app-count
          # floor below rather than by hope.
          #
          # COUNTRY BEFORE CHART, as build_demo.sh and provision_client.sh do:
          # l10n_et_base loads the Ethiopian chart, and Odoo cannot switch
          # charts afterwards.
          CATALOG="account,board,calendar,contacts,crm,data_recycle,fleet,hr,hr_attendance,hr_expense,hr_holidays,hr_recruitment,im_livechat,l10n_et_base,l10n_et_payroll,l10n_et_reports,lunch,maintenance,marketing_card,mass_mailing,mass_mailing_sms,mrp,point_of_sale,pos_restaurant,project,project_todo,purchase,repair,sale_management,sapian_core,stock,survey,vertical_pharma,website,website_event,website_sale,website_slides"

          odoo ${ARGS} -d ci_rail -i base --without-demo=all --log-level=warn
          echo "company = env['res.company'].search([], limit=1); company.country_id = env.ref('base.et'); env.cr.commit(); print('SAPIAN-RAIL-SETUP country=%s' % company.country_id.code)" \
            | odoo shell ${ARGS} -d ci_rail --no-http --log-level=warn 2>&1 | tee /tmp/rail-setup.log
          grep -q "SAPIAN-RAIL-SETUP country=ET" /tmp/rail-setup.log \
            || { echo "::error::The odoo shell never reported — the country was not set, so l10n_et_base would load the wrong chart."; exit 1; }

          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_rail \
            -i "sapian_theme,${CATALOG}" \
            --without-demo=all \
            --test-enable \
            --test-tags '/sapian_theme:TestSapianAppRailRendered,/sapian_theme:TestSapianAppRailOverflow,/sapian_theme:TestSapianAppRailKeepsScroll,/sapian_theme:TestSapianAppRailSmallScreen,/sapian_theme:TestAppRailDataOverHttp,/sapian_theme:TestSapianBackendFooterRendered,/sapian_theme:TestSapianBackendFooterSmallScreen,/sapian_theme:TestBackendFooterDataOverHttp,/sapian_theme:TestSapianSidebarStates,/sapian_theme:TestSapianSidebarStatesDiscriminate,/sapian_theme:TestSapianSidebarCollapse,/sapian_theme:TestSapianSidebarKeyboard,/sapian_theme:TestSapianSidebarHeader,/sapian_theme:TestSapianSidebarHeaderOccludes,/sapian_theme:TestSapianSidebarStandsDownForTheLauncher,/sapian_theme:TestSapianSidebarCornerIsNotAHole' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/rail.log

          if ! grep -q "odoo\.tests\.result:" /tmp/rail.log; then
            echo "::error::The test runner never reported a result line — no tests were executed."
            exit 1
          fi
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/rail.log; then
            echo "::error::The app rail or backend footer tests failed."
            exit 1
          fi

          # THE BROWSER ACTUALLY RAN. Every check above this line is satisfied
          # by a run in which browser_js raised SkipTest and nothing was
          # rendered: no test failed, so nothing failed. These lines are
          # printed by console.log from INSIDE the page, so they cannot be
          # produced by a skip, by a missing browser, or by an empty selection.
          echo "--- what the browser reported ---"
          grep -E "SAPIAN-(RAIL|FOOTER|SIDEBAR)" /tmp/rail.log | sed 's/^/  /' || true
          for marker in \
            "SAPIAN-RAIL viewport=" \
            "SAPIAN-RAIL-DISCRIMINATION restored -> clean" \
            "SAPIAN-RAIL-DISCRIMINATION unreachable-tail -> " \
            "SAPIAN-RAIL-DISCRIMINATION tile-outside-box -> " \
            "overflows=" \
            "SAPIAN-RAIL-OVERFLOW forcedRailHeight=" \
            "SAPIAN-RAIL-SCROLLKEEP tiles=" \
            "SAPIAN-RAIL-SMALL viewport=" \
            "SAPIAN-FOOTER text=" \
            "SAPIAN-FOOTER-DISCRIMINATION removed -> " \
            "SAPIAN-FOOTER-SMALL shown=false" \
            "SAPIAN-SIDEBAR width=200" \
            "rowHeight=44" \
            "activeColor=\"rgb(255, 255, 255)\"" \
            "SAPIAN-SIDEBAR-DISCRIMINATION identical-states -> " \
            "SAPIAN-SIDEBAR-DISCRIMINATION under-the-footer -> " \
            "SAPIAN-SIDEBAR-DISCRIMINATION restored -> clean" \
            "SAPIAN-SIDEBAR-COLLAPSE wide=200 narrow=56 wideAgain=200" \
            "SAPIAN-SIDEBAR-KEYBOARD rowFocusable=true focusVisible=true" \
            "tag=BUTTON" \
            "SAPIAN-SIDEBAR-HEADER paths=4" \
            "word=\"SapianERP\"" \
            "expandedOpen=\"true\" expandedShut=\"false\"" \
            "wordShown=true->false" \
            "chevShown=true->false" \
            "SAPIAN-SIDEBAR-OCCLUSION expanded" \
            "SAPIAN-SIDEBAR-OCCLUSION collapsed" \
            "restAlpha=1" \
            "hoverAlpha=1" \
            "hoverTint=present" \
            "centre=header left=header right=header upper=header lower=header" \
            "SAPIAN-SIDEBAR-LAUNCHER before=visible/true open=hidden/false" \
            "openCollapsed=hidden/true" \
            "after=visible/true" \
            "SAPIAN-SIDEBAR-CORNER" \
            "openVis=visible openAlpha=1" \
            "covers=true clickable=false" \
            "railVis=hidden chevron=false"; do
            if ! grep -qF "${marker}" /tmp/rail.log; then
              echo "::error::The browser never reported '${marker}'. The rail tests did not run in a browser — most likely Chrome was missing and browser_js skipped."
              exit 1
            fi
          done

          # And the rail was not empty. A one-app rail would satisfy every
          # assertion above while proving nothing about a real tenant.
          # THE SCALE THIS JOB EXISTS FOR. Raised from 8 when the database was
          # swapped from 14 apps to the product's 36: a job that silently fell
          # back to a handful of apps would still satisfy every marker above
          # while testing the configuration we do not sell, which is exactly
          # how the vacuous scroll assertion survived.
          MIN_RAIL_TILES=30
          TILES=$(grep -oE "SAPIAN-RAIL viewport=[^ ]+ apps=[0-9]+ tiles=[0-9]+" /tmp/rail.log \
                  | grep -oE "tiles=[0-9]+" | grep -oE "[0-9]+" | head -1)
          TILES=${TILES:-0}
          echo "Rail tiles rendered: ${TILES} (floor ${MIN_RAIL_TILES})"
          if [ "${TILES}" -lt "${MIN_RAIL_TILES}" ]; then
            echo "::error::The rail rendered ${TILES} tiles; expected at least ${MIN_RAIL_TILES}. The install list did not create the apps this job exists to draw."
            exit 1
          fi

          # AND IT MUST ACTUALLY OVERFLOW. The whole point of the swap: at 14
          # apps everything fitted, so `lastReachableByScrolling=true` meant
          # "there was nothing to scroll" and could not have been false. If the
          # rail stops overflowing here, the reachability assertion has gone
          # back to proving nothing and this job should say so rather than pass.
          if ! grep -q "overflows=true" /tmp/rail.log; then
            echo "::error::The rail did not overflow on a ${TILES}-app database, so its scroll and truncation assertions were vacuous. Either the app count collapsed or the row height changed."
            exit 1
          fi
          echo "Rail overflows naturally at ${TILES} apps — the scroll assertions are real."

          # THE SIDEBAR'S SCROLL SURVIVED THE COLLAPSE, read as three equal
          # numbers rather than as "the test passed". Collapsing is a re-render
          # for a reason unrelated to which app you are in, and that is exactly
          # the shape that used to reset scrollTop to 0 (PR #35).
          SCROLL=$(grep -oE "SAPIAN-SIDEBAR-COLLAPSE .*scroll=[0-9]+/[0-9]+/[0-9]+" /tmp/rail.log \
                   | grep -oE "scroll=[0-9]+/[0-9]+/[0-9]+" | head -1)
          echo "Sidebar scroll across collapse/expand: ${SCROLL}"
          case "${SCROLL}" in
            scroll=0/*) echo "::error::The sidebar never scrolled, so the collapse test proved nothing about the scroll position."; exit 1 ;;
            "") echo "::error::The sidebar collapse test reported no scroll figures."; exit 1 ;;
          esac
          if [ "$(echo "${SCROLL}" | grep -oE "[0-9]+" | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::Collapsing the sidebar moved the scroll position: ${SCROLL}"
            exit 1
          fi

  launcher-defaults:
    name: Launcher defaults reach the page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WHY A SEPARATE JOB.
    #
    # sapian_theme defaults two web_responsive fields — is_redirect_home and
    # apps_menu_theme — so that a user lands on the app launcher, in our brand,
    # instead of on a configuration screen in Odoo's lilac. Both defaults are
    # worthless if they do not reach the browser, and this repository has been
    # burned by exactly that distance once: the SCSS said teal, the bundle
    # contained the brand seven times, and the button rendered Odoo purple.
    #
    # sapian_theme does NOT depend on web_responsive (it must stay installable
    # on a database carrying nothing else of ours), so these assertions cannot
    # live in the standard suite — there would be no launcher to look at. The
    # test classes are tagged `-standard` and selected here by the bare
    # `sapian_launcher` tag, because `/module:Class` selectors implicitly
    # require `standard` (odoo/tests/tag_selector.py). They are therefore never
    # skipped: either this job selects and runs them, or nothing does — and the
    # marker greps below fail the job if the browser did not report.
    #
    # It runs on the DEMO TENANT's module set, not a synthetic one, because
    # "lands on a configuration screen" is a claim about the database we
    # actually ship to a prospect.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install headless Chrome and websocket-client
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/scripts/install_test_browser.sh"

      - name: A fresh user lands on the launcher, painted in our brand
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          # Country before the chart, exactly as scripts/build_demo.sh does:
          # with demo data off the single company is created on generic_coa,
          # and Odoo does not allow switching charts afterwards.
          odoo ${ARGS} -d ci_launcher -i base --without-demo=all --log-level=warn
          echo "company = env['res.company'].search([], limit=1); company.country_id = env.ref('base.et'); env.cr.commit(); print('SAPIAN-LAUNCHER-SETUP country=%s' % company.country_id.code)" \
            | odoo shell ${ARGS} -d ci_launcher --log-level=warn 2>&1 | tee /tmp/launcher-setup.log
          grep -q "SAPIAN-LAUNCHER-SETUP country=ET" /tmp/launcher-setup.log \
            || { echo "::error::The odoo shell never reported — the country was not set, so the tenant is not the one we ship."; exit 1; }

          odoo ${ARGS} -d ci_launcher \
            -i sapian_demo_trader,sapian_theme,web_responsive \
            --without-demo=all \
            --test-enable --test-tags 'sapian_launcher,/sapian_theme:TestLauncherDefaultValues,/sapian_theme:TestLauncherProvisioningCommand' \
            --log-level=test 2>&1 | tee /tmp/launcher.log

          if ! grep -q "odoo\.tests\.result:" /tmp/launcher.log; then
            echo "::error::The test runner never reported a result line — no tests were executed."
            exit 1
          fi
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/launcher.log; then
            echo "::error::The launcher default tests failed."
            exit 1
          fi

          # THE BROWSER ACTUALLY RAN, AND SAID THE RIGHT THING.
          # Every check above is satisfied by a run where browser_js raised
          # SkipTest: no test failed, so nothing failed. These lines are printed
          # by console.log from INSIDE the page, so they cannot be produced by a
          # run that never opened a browser.
          #
          # Each marker is a full assertion, not just a prefix, so a default
          # that silently stopped reaching the page turns this red rather than
          # merely changing a number nobody reads.
          for marker in \
            'SAPIAN-LAUNCHER user=launcher.default.user launcherOpen=true actionLoaded=false' \
            'theme=community' \
            'brandInBackground=true milkInBackground=false' \
            'SAPIAN-LAUNCHER user=launcher.control.user launcherOpen=false actionLoaded=true' \
            'SAPIAN-LAUNCHER user=launcher.milk.user launcherOpen=true' \
            'brandInBackground=false milkInBackground=true' \
            'SAPIAN-RAIL-OCCLUSION closed=true open=false' \
            'reopened=true' \
            'visibility=visible/hidden/visible' \
            'header=visible/visible/visible' \
            'bodyClass=false/true' \
            'SAPIAN-LAUNCHER-STAYS user=launcher.stays.user earlyUrl=/odoo earlyLauncher=true url=/odoo launcher=true' \
            'actionLoaded=false action=""'; do
            if ! grep -qF "${marker}" /tmp/launcher.log; then
              echo "::error::The browser never reported '${marker}'. Either the defaults did not reach the page, or the tests did not run in a browser at all."
              exit 1
            fi
          done

          # The launcher was not empty, and the rail kept its tiles across the
          # open/close cycle. A one-app launcher satisfies every assertion above
          # while proving nothing.
          MIN_LAUNCHER_ITEMS=5
          ITEMS=$(grep -oE "user=launcher\.default\.user .*items=[0-9]+" /tmp/launcher.log \
                  | grep -oE "items=[0-9]+" | grep -oE "[0-9]+" | head -1)
          ITEMS=${ITEMS:-0}
          echo "Launcher items rendered: ${ITEMS} (floor ${MIN_LAUNCHER_ITEMS})"
          if [ "${ITEMS}" -lt "${MIN_LAUNCHER_ITEMS}" ]; then
            echo "::error::The launcher rendered ${ITEMS} apps; expected at least ${MIN_LAUNCHER_ITEMS}."
            exit 1
          fi
          # tiles=N/N/N — same count closed, covered and reopened.
          TILES=$(grep -oE "SAPIAN-RAIL-OCCLUSION .*tiles=[0-9]+/[0-9]+/[0-9]+" /tmp/launcher.log \
                  | grep -oE "tiles=[0-9]+/[0-9]+/[0-9]+" | head -1)
          echo "Rail tiles across the launcher cycle: ${TILES}"
          case "${TILES}" in
            tiles=0/*) echo "::error::The rail had no tiles, so the occlusion test proved nothing."; exit 1 ;;
          esac
          FIRST=$(echo "${TILES}" | grep -oE "[0-9]+" | head -1)
          if [ "$(echo "${TILES}" | grep -oE "[0-9]+" | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::The rail changed tile count across the launcher cycle: ${TILES}"
            exit 1
          fi
          echo "Rail held ${FIRST} tiles closed, covered and reopened."

      - name: Upstream's own tests still pass against our defaults
        shell: bash
        # WHAT IS *NOT* HERE, AND WHY.
        #
        # web_responsive's TestResUsers.test_compute_redirect_home asserts that
        # a new user has is_redirect_home == False — the default sapian_theme
        # deliberately overrides. An earlier version of this job tried to assert
        # that divergence directly, by requiring that test to FAIL. That was
        # wrong twice over and CI caught it:
        #
        #   1. On a database where `account` is installed, the test does not
        #      fail — it ERRORS before running. `-u web_responsive` reloads only
        #      that module, so its at_install tests run at position 39/82,
        #      before `account` is loaded; BaseCommon.setUpClass then creates a
        #      res.partner and hits "null value in column autopost_bills
        #      violates not-null constraint", because the DB column exists from
        #      the earlier full install but its Python default is not registered
        #      yet. Zero tests run. The assertion only held on the account-free
        #      database it was written against.
        #   2. "0 failures, 1 errors of 0 tests" does not match a grep for
        #      "N failed", so that error read as the test PASSING — a check
        #      reporting the opposite of the truth.
        #
        # It is also redundant. The divergence is already caught from both ends:
        #   - our side, by /sapian_theme:TestLauncherDefaultValues below, which
        #     asserts a created user gets True on a database that HAS the field;
        #   - upstream's side, by the tree-hash pin: any change to upstream —
        #     that test included — changes f1e9c8df... and scripts/check_vendor.sh
        #     goes red, which is exactly the moment a human should look.
        #
        # So this step keeps only the half that is sound and useful: everything
        # upstream ships, except the one test our approved default invalidates,
        # must pass against our stack. That is regression cover for the vendored
        # module which nothing else in this repo provides.
        run: |
          set -euo pipefail
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"
          DIVERGENT='/web_responsive:TestResUsers.test_compute_redirect_home'

          odoo ${ARGS} -d ci_launcher -u web_responsive \
            --test-enable --test-tags "/web_responsive,-${DIVERGENT}" \
            --log-level=test 2>&1 | tee /tmp/upstream.log

          grep -q "odoo\.tests\.result:" /tmp/upstream.log \
            || { echo "::error::Upstream's tests never reported — none were executed."; exit 1; }
          # BOTH failures and errors. An error is not a pass, and reading only
          # "N failed" is the mistake that made the previous version of this job
          # report the opposite of what happened.
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/upstream.log; then
            echo "::error::A vendored web_responsive test failed or errored that is NOT the divergence we chose."
            exit 1
          fi
          grep -q "odoo\.tests\.stats: web_responsive: " /tmp/upstream.log \
            || { echo "::error::No web_responsive tests ran at all, so this step proved nothing."; exit 1; }
          echo "Upstream's remaining tests pass against our defaults."

  bot-rename-survives-upgrade:
    name: SapianBot survives an upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WHY A SEPARATE JOB, and it is the only job here that exists to disprove a
    # specific wrong implementation rather than to test a feature.
    #
    # `sapian_theme_mail` renames `base.partner_root` from OdooBot to
    # SapianBot. The obvious way to do that is a data record, and it does not
    # work — `orm/models.py:5165` skips a record whose ir_model_data row
    # carries `noupdate` when the module is being UPGRADED rather than
    # installed, and `base` sets that flag on this xmlid at the first install.
    # `_build_update_xmlids_query` never rewrites the flag, so no later module
    # can clear it by declaring its own block updateable.
    #
    # The consequence is not a visible revert. It is that the rename would
    # reach NEW databases only — which is every database CI builds and no
    # database a client runs — while every check stayed green. So the module
    # writes the record from Python (a hook at install, a migration on
    # upgrade), and this job is the proof, because the argument above is an
    # argument and CLAUDE.md is explicit that a guard nobody has watched go red
    # is another thing that passes by doing nothing.
    #
    # Four steps, and step 4 is the one that matters: it puts Odoo's identity
    # back WITHOUT rewinding the module version, so no migration runs, and
    # REQUIRES the identity tests to fail. If they pass there, every other step
    # in this job is decoration.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: The rename holds through -u mail and -u sapian_theme_mail
        shell: bash
        run: |
          # `set +e` EXPLICITLY, and then ACCUMULATE. Both halves are needed.
          #
          # Actions runs `shell: bash` as `bash --noprofile --norc -eo pipefail
          # {0}`, so the `-e` comes from the RUNNER before this script starts and
          # a bare `set -uo pipefail` here does not remove it. Measured: step 1's
          # tests failed, bash exited on the spot, and steps 2 to 5 — the
          # `-u mail` check, the red proof and the migration proof — never ran,
          # while the job reported one failure as though it had checked five.
          #
          # But `set +e` ALONE creates the mirror-image defect: a later step
          # fails, nothing exits, and the job goes GREEN. So every check calls
          # `fail <label>` instead of `exit 1`, FAILURES accumulates, and the
          # last line of the step is the only thing that decides the job. A
          # deliberate failure injected into step 4 must turn the job red and
          # name step 4 — `SAPIAN_INJECT_FAILURE=4` does exactly that, and it is
          # how this accumulation is proved rather than asserted.
          set +e
          set -uo pipefail
          FAILURES=""
          fail () {   # $1 = label, rest = detail lines
            FAILURES="${FAILURES}${FAILURES:+, }$1"
            echo "::error::$1"
            shift
            [ $# -gt 0 ] && printf '     %s\n' "$@" >&2
            return 0
          }
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"
          # The real assertions, re-run after every step rather than a shell
          # reimplementation of them: a second copy of "is it called SapianBot"
          # is a second thing to keep true.
          IDENTITY='/sapian_theme_mail:TestTheSystemPartnerIsOurs,/sapian_theme_mail:TestTheBotSignsTheChatter'
          # TestTheSystemPartnerIsOurs is 7 tests at this commit (the two DISK-ONLY
          # ones moved to TestTheFilesWeShip, which this selector deliberately
          # does NOT include: a file comparison is not evidence about the row) and
          # TestTheBotSignsTheChatter 1. The floor is what stops a mistyped
          # selector reporting "0 failed" and passing.
          MIN_IDENTITY_TESTS=7

          green () {   # $1 = label, $2 = log
            grep -q "odoo\.tests\.result:" "$2" \
              || { echo "::error::$1: the test runner never reported — nothing ran."; exit 1; }
            if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" "$2"; then
              fail "$1: the system partner no longer carries our identity."
              grep -E "(FAIL|ERROR): Test" "$2" | head -20
              return 0
            fi
            RAN=$(grep -oE "odoo\.tests\.stats: sapian_theme_mail: [0-9]+ tests" "$2" \
                  | grep -oE "[0-9]+ tests" | grep -oE "^[0-9]+" || echo 0)
            if [ "${RAN}" -lt "${MIN_IDENTITY_TESTS}" ]; then
              fail "$1: only ${RAN} identity tests ran (floor ${MIN_IDENTITY_TESTS}); the selection is broken, so green means nothing."
              return 0
            fi
            echo "OK — $1: ${RAN} identity tests, all passing."
          }

          probe () {   # prints SAPIAN-BOT name=<name> from the live database
            echo 'p = env.ref("base.partner_root").sudo().with_context(active_test=False); print("SAPIAN-BOT name=%s email=%s" % (p.name, p.email))' \
              | odoo shell ${ARGS} -d ci_bot --log-level=warn 2>&1 | grep -o "SAPIAN-BOT name=[^ ]* email=[^ ]*"
          }

          # H3 / H4 DIAGNOSTICS. These exist because this job failed once with a
          # combination that could not be explained from its own log: the three
          # name/email assertions failed while all four record-reading avatar
          # assertions passed on the same database. Two candidate causes were
          # "CI is not testing the tree we think" and "a different module set",
          # and neither could be ruled out because the job never printed either.
          echo "SAPIAN-H3 head=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          echo "SAPIAN-H3 head-subject=$(git -C "${GITHUB_WORKSPACE}" log -1 --format=%s)"
          echo "SAPIAN-H3 manifest-version=$(grep -oE '19\.0\.[0-9.]+' "${GITHUB_WORKSPACE}/addons/sapian_theme_mail/__manifest__.py" | head -1)"
          echo "SAPIAN-H3 post_init_hook-in-manifest=$(grep -c 'post_init_hook' "${GITHUB_WORKSPACE}/addons/sapian_theme_mail/__manifest__.py")"
          echo "SAPIAN-H3 hook-call-in-init=$(grep -c '_sapian_apply_bot_identity' "${GITHUB_WORKSPACE}/addons/sapian_theme_mail/__init__.py")"
          echo "SAPIAN-H3 migrations=$(ls "${GITHUB_WORKSPACE}/addons/sapian_theme_mail/migrations" 2>&1)"

          # 1. A database, then the module.
          odoo ${ARGS} -d ci_bot -i base --without-demo=all --log-level=warn \
            || { fail "base install failed; nothing below ran."; }
          odoo ${ARGS} -d ci_bot -i sapian_theme_mail --without-demo=all \
            --test-enable --test-tags "${IDENTITY}" --log-level=test 2>&1 | tee /tmp/bot-install.log
          # H4: the module SET, not just a count. 186 queries in CI against 189
          # locally was the only hint the hook had not run, and three queries is
          # far too thin a thread to hang a conclusion on.
          echo "SAPIAN-H4 $(grep -oE '[0-9]+ modules loaded' /tmp/bot-install.log | tail -1)"
          grep -oE "Loading module [a-z_0-9]+ \(" /tmp/bot-install.log | sed 's/Loading module //; s/ (//' | sort | tr '\n' ' ' | sed 's/^/SAPIAN-H4 set: /'
          echo
          echo "SAPIAN-H4 hook-lines=$(grep -cE 'system partner is now|email button colour applied' /tmp/bot-install.log)"
          grep -E "system partner is now|email button colour applied" /tmp/bot-install.log | sed 's/^/     /' || true
          green "after install" /tmp/bot-install.log
          probe

          # 2. `-u mail`. This is the question the whole mechanism turns on:
          #    does Odoo put OdooBot back? (It cannot — mail's own record is
          #    blocked by the same noupdate flag — but that is the argument,
          #    and this is the measurement.)
          odoo ${ARGS} -d ci_bot -u mail \
            --test-enable --test-tags "${IDENTITY}" --log-level=test 2>&1 | tee /tmp/bot-umail.log
          green "after -u mail" /tmp/bot-umail.log

          # 2b. THE LOAD ORDER, DELIBERATELY AGAINST US.
          #
          #     Everything above loads our module last, which is the case that
          #     was already passing. The defect was the other order: this module
          #     and `mail_bot` are both auto_install on `mail`, so the graph
          #     treated them as siblings and visited them in an arbitrary order.
          #     Across identical runs this module moved between 26/30 and 27/30
          #     and the bot's name moved with it.
          #
          #     `mail_bot` is now a declared dependency, so the order is total.
          #     This step proves that claim rather than restating it: `mail_bot`
          #     must come BEFORE `sapian_theme_mail`, every run, or the fix is
          #     back to being a coin toss.
          #
          #     Measured from THE LOADER'S OWN OUTPUT, not from a proxy.
          #     `ir_module_module.id` is DISCOVERY order (an alphabetical scan
          #     of the addons path), not load order, so ordering by it would
          #     answer a different question and would look right most of the
          #     time. Odoo prints "Loading module <name> (n/N)" as it goes, and
          #     those are the very numbers the defect was reported in.
          #
          #     scripts/ci_assert_load_order.py is proved to discriminate: it
          #     goes red on a reversed order, on a missing module, and on a log
          #     with no loader lines at all.
          python3 "${GITHUB_WORKSPACE}/scripts/ci_assert_load_order.py" \
            /tmp/bot-install.log mail mail_bot sapian_theme_mail \
            || fail "step 2b: mail_bot does not load before sapian_theme_mail, so the sibling ambiguity is back"

          #     And the adversary itself: re-run mail_bot's install AFTER ours,
          #     which is the sequence the old code lost to. The identity must
          #     still be ours afterwards.
          odoo ${ARGS} -d ci_bot -u mail_bot --log-level=warn 2>&1 | tee /tmp/bot-umailbot.log
          odoo ${ARGS} -d ci_bot -u sapian_theme_mail \
            --test-enable --test-tags "${IDENTITY}" --log-level=test 2>&1 | tee /tmp/bot-after-adversary.log
          green "after -u mail_bot ran last" /tmp/bot-after-adversary.log
          probe

          # 3. `-u sapian_theme_mail`, the ordinary upgrade of our own module.
          odoo ${ARGS} -d ci_bot -u sapian_theme_mail \
            --test-enable --test-tags "${IDENTITY}" --log-level=test 2>&1 | tee /tmp/bot-uself.log
          green "after -u sapian_theme_mail" /tmp/bot-uself.log
          probe

          # 4. THE RED PROOF, and the reason this job is not decoration.
          #    Put Odoo's identity back, leaving the module version alone so no
          #    migration runs, then upgrade. Nothing should repair it, and the
          #    identity tests MUST fail. A pass here would mean they cannot
          #    detect the defect they exist for.
          echo 'p = env.ref("base.partner_root").sudo().with_context(active_test=False); p.write({"name": "OdooBot", "email": "odoobot@example.com"}); env.cr.commit(); print("SAPIAN-BOT-BROKEN name=%s" % p.name)' \
            | odoo shell ${ARGS} -d ci_bot --log-level=warn 2>&1 | tee /tmp/bot-break.log
          grep -q "SAPIAN-BOT-BROKEN name=OdooBot" /tmp/bot-break.log \
            || { fail "The break did not land, so the red proof below would be measuring nothing."; }

          odoo ${ARGS} -d ci_bot -u sapian_theme_mail \
            --test-enable --test-tags "${IDENTITY}" --log-level=test 2>&1 | tee /tmp/bot-red.log
          grep -q "odoo\.tests\.result:" /tmp/bot-red.log \
            || { fail "The red proof did not run at all — that is ABORTED, not red."; }
          if ! grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/bot-red.log; then
            fail "The identity tests PASSED on a database whose bot is called OdooBot. They cannot detect the defect they exist for, so every green above is meaningless."
          fi
          echo "OK — red proof: the identity tests fail when the bot is OdooBot."

          # THE PROOF THAT THIS ACCUMULATION WORKS. Injected on demand, in
          # step 4 rather than step 1, because a failure in step 1 proves nothing
          # about whether a LATER failure is noticed.
          if [ "${SAPIAN_INJECT_FAILURE:-}" = "4" ]; then
            fail "step 4: deliberate injected failure (SAPIAN_INJECT_FAILURE=4)"
          fi

          # 5. THE MIGRATION, which is the half a data record could never do.
          #    Rewind the recorded version so Odoo sees an upgrade across
          #    19.0.1.3.0 — exactly the state of a tenant that installed this
          #    module before the rename existed — and require the migration to
          #    repair what step 4 broke.
          echo 'env.cr.execute("UPDATE ir_module_module SET latest_version = %s WHERE name = %s", ("19.0.1.1.0", "sapian_theme_mail")); env.cr.commit(); print("SAPIAN-BOT-REWOUND")' \
            | odoo shell ${ARGS} -d ci_bot --log-level=warn 2>&1 | tee /tmp/bot-rewind.log
          grep -q "SAPIAN-BOT-REWOUND" /tmp/bot-rewind.log \
            || { fail "Could not rewind the module version; the migration proof did not run."; }

          odoo ${ARGS} -d ci_bot -u sapian_theme_mail \
            --test-enable --test-tags "${IDENTITY}" --log-level=test 2>&1 | tee /tmp/bot-migrate.log
          grep -q "sapian_theme_mail migration" /tmp/bot-migrate.log \
            || { fail "The migration script never ran, so whatever fixed the record was not the thing being tested."; }
          green "after the migration reached an existing tenant" /tmp/bot-migrate.log
          probe

          # THE ONLY THING THAT DECIDES THIS JOB. Every check above records and
          # carries on, so this line is what turns an accumulated failure into a
          # red job — and a job whose last statement is `true` is a job that
          # cannot fail.
          if [ -n "${FAILURES}" ]; then
            echo "::error::This job failed: ${FAILURES}"
            exit 1
          fi
          echo "All five steps ran and all five passed."

  brand-assets:
    name: One mark, everywhere, and it survives an upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THREE THINGS NOTHING ELSE CHECKS.
    #
    # 1. The rasters are what the committed script produces from the committed
    #    SVG. Regenerate and `git diff --exit-code`: a hand-edited PNG, or a
    #    palette change nobody re-ran the script for, fails here. Before this,
    #    the icon set had drifted into a palette that was not the mark's and
    #    six modules had no icon at all.
    # 2. The favicon reaches the served <head> and the default logo reaches
    #    res.company on INSTALL. Two mechanisms, because res.company has no
    #    favicon field in Odoo 19 — assuming it did took nine jobs down at once.
    # 3. The logo survives an UPGRADE, which is the path a post_init_hook cannot
    #    take. Proved by resetting the logo on a built database and running -u,
    #    exactly as sapian_theme_mail proves the bot's name. The favicon needs no
    #    such proof: it is a view, and an upgrade reloads views.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: The rasters are what the script generates, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq libcairo2 >/dev/null
          # --break-system-packages: the odoo:19.0 image is Debian, and Debian
          # marks its interpreter externally managed (PEP 668), so a bare
          # `pip install` exits 1 before installing anything.
          # The versions are PINNED because this step compares BYTES: a
          # different cairosvg or Pillow re-renders the same SVG to a different
          # PNG, and the diff below would fail on a file nobody touched.
          pip install --quiet --break-system-packages cairosvg==2.9.0 pillow==12.3.0

          # NOT `git diff`. There is no git here, in EITHER sense: the odoo
          # image ships without the binary, and because it does,
          # actions/checkout fell back to downloading a tarball through the
          # REST API — so there is no .git directory to diff against either.
          # The first version of this step ran `git diff --exit-code`, got
          # "git: command not found", and its `if !` read that as "the files
          # changed". A missing tool reported as a brand defect.
          #
          # Hashing every PNG before and after is what the diff was FOR, and it
          # asserts a count as well, which the diff did not: a run that wrote
          # nothing at all cannot pass.
          snapshot() { find addons brand -name '*.png' -type f | sort | xargs sha256sum; }
          snapshot > /tmp/rasters-before.txt
          BEFORE=$(wc -l < /tmp/rasters-before.txt)
          if [ "${BEFORE}" -lt 50 ]; then
            echo "::error::Only ${BEFORE} PNGs found before regenerating; expected at least 50. The checkout is wrong, so this proves nothing."
            exit 1
          fi
          python3 scripts/build_brand_assets.py
          snapshot > /tmp/rasters-after.txt
          if ! diff -u /tmp/rasters-before.txt /tmp/rasters-after.txt; then
            echo "::error::Regenerating the brand assets changed files. A raster was edited by hand, or the sources moved and scripts/build_brand_assets.py was never re-run. Run it and commit the result."
            exit 1
          fi
          echo "OK — all ${BEFORE} rasters match what the committed sources generate."

      - name: Install, then upgrade, and the brand assets survive both
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          # ---- PHASE 1: INSTALL -------------------------------------------
          odoo ${ARGS} -d ci_brand -i base --without-demo=all --log-level=warn
          odoo ${ARGS} -d ci_brand -i sapian_theme --without-demo=all \
            --test-enable \
            --test-tags '/sapian_theme:TestBrandAssets,/sapian_theme:TestFaviconReachesTheTab' \
            --log-level=test 2>&1 | tee /tmp/brand-install.log
          grep -q "odoo\.tests\.result:" /tmp/brand-install.log \
            || { echo "::error::The install-phase tests never reported."; exit 1; }
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/brand-install.log; then
            echo "::error::The brand assets do not reach the page or the company on INSTALL."
            exit 1
          fi
          # A REPORTED RESULT IS NOT A RUN SUITE. Both classes are tagged
          # post_install, and a mis-typed class name in --test-tags selects
          # nothing while the runner still prints a clean result line.
          # `of N tests`, because that is what Odoo actually prints:
          #   "odoo.tests.result: 0 failed, 0 error(s) of 7 tests when ..."
          # The first version of this line matched "result: N tests", found
          # nothing, and failed the job on a run where all 7 tests had passed.
          RAN=$(sed -n 's/.*tests\.result:.* of \([0-9][0-9]*\) tests.*/\1/p' /tmp/brand-install.log | tail -1)
          if [ -z "${RAN:-}" ] || [ "${RAN}" -lt 7 ]; then
            echo "::error::Expected at least 7 brand-asset tests, the runner reported '${RAN:-none}'."
            exit 1
          fi
          # And skips are silent in that count's favour.
          if grep -qE "[1-9][0-9]* skipped" /tmp/brand-install.log; then
            echo "::error::A brand-asset test skipped, so it proved nothing:"
            grep -E "skipped" /tmp/brand-install.log
            exit 1
          fi

          # ---- PHASE 2: RESET, THEN UPGRADE -------------------------------
          # The logo is put back to Odoo's stock image on every company, so the
          # upgrade has something real to repair. Without this the -u below
          # would pass on a database that was already correct — a success
          # signal produced by doing nothing.
          echo 'env["res.company"].sudo().search([]).write({"logo": False}); env.cr.commit(); print("SAPIAN-BRAND reset=%d" % env["res.company"].sudo().search_count([("uses_default_logo","=",True)]))' \
            | odoo shell ${ARGS} -d ci_brand --no-http --log-level=warn 2>&1 | tee /tmp/brand-reset.log
          grep -qE "SAPIAN-BRAND reset=[1-9]" /tmp/brand-reset.log \
            || { echo "::error::The reset step never reported, so the upgrade below proves nothing."; exit 1; }

          # REWIND THE RECORDED VERSION, or the migration never runs and this
          # whole phase measures nothing. Odoo executes migrations/<version>/
          # only when the INSTALLED version is below the manifest's, and phase 1
          # installed this module at the manifest version — so a bare
          # `-u sapian_theme` on a freshly installed database skips every
          # migration script silently. The first version of this step did
          # exactly that and reported `wrong=1 of 1`: the check was right and
          # the proof was empty.
          #
          # Same mechanism the bot-rename job uses, and the same reason: it puts
          # the database into the state of a tenant that installed this module
          # before the migration existed, which is the only state the migration
          # is for.
          echo 'env.cr.execute("UPDATE ir_module_module SET latest_version = %s WHERE name = %s", ("19.0.2.1.0", "sapian_theme")); env.cr.commit(); print("SAPIAN-BRAND rewound")' \
            | odoo shell ${ARGS} -d ci_brand --no-http --log-level=warn 2>&1 | tee /tmp/brand-rewind.log
          grep -q "SAPIAN-BRAND rewound" /tmp/brand-rewind.log \
            || { echo "::error::Could not rewind the module version, so the migration below would not run."; exit 1; }

          odoo ${ARGS} -d ci_brand -u sapian_theme --log-level=info 2>&1 | tee /tmp/brand-upgrade.log
          # THE MIGRATION'S OWN LINE, not the absence of an error. A `-u` that
          # skipped it exits 0 and looks identical to one that ran it.
          if ! grep -qE "sapian_theme: upgrade wrote the default logo on [1-9]" /tmp/brand-upgrade.log; then
            echo "::error::migrations/19.0.2.2.0/end-brand_assets.py did not run, or ran and wrote nothing. Whatever the check below reports, it is not about the migration."
            grep -i "migration" /tmp/brand-upgrade.log | head -20
            exit 1
          fi

          echo 'c = env["res.company"].sudo().search([]); import base64; from odoo.tools import file_open; ours = base64.b64encode(file_open("sapian_theme/static/src/img/sapian_logo.png","rb").read()); print("SAPIAN-BRAND wrong=%d of %d" % (len(c.filtered(lambda x: x.logo != ours)), len(c)))' \
            | odoo shell ${ARGS} -d ci_brand --no-http --log-level=warn 2>&1 | tee /tmp/brand-after.log
          grep -q "SAPIAN-BRAND wrong=" /tmp/brand-after.log \
            || { echo "::error::The post-upgrade check never reported."; exit 1; }
          if ! grep -q "SAPIAN-BRAND wrong=0 of" /tmp/brand-after.log; then
            echo "::error::After -u sapian_theme, companies still carry a logo that is not ours:"
            grep "SAPIAN-BRAND wrong=" /tmp/brand-after.log
            exit 1
          fi
          echo "OK — install and upgrade both write the default logo."

  outgoing-email-debranded:
    name: No outgoing email carries another vendor's name
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE MODULES THAT ACTUALLY CARRY IT, and why this is not the integration
    # job with one more tag.
    #
    # A sweep of the 83 modules reachable from STANDARD_CATALOG — 1,362 data
    # files read — found ELEVEN templates carrying Odoo branding plus TWO
    # carrying Odoo's logo image, spread across auth_signup, im_livechat, lunch,
    # gamification, hr_expense, website_slides, website_profile, digest and
    # account. `ci_test` installs none of the optional ones, so the sweep would
    # run there against a database with almost nothing to find and pass by
    # having nothing to do.
    #
    # RED FIRST, IN THE SAME JOB AND ON THE SAME DATABASE. Phase 1 builds it
    # WITHOUT our module and shows the branding survives the real send path;
    # phase 2 installs our module into THAT database and shows it does not. A
    # green phase 2 alone cannot tell a working scrub from a database that was
    # never branded.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Branded before, clean after, on one database
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"
          BRANDED="auth_signup,im_livechat,lunch,gamification,hr_expense,website_slides,website_profile,digest,account,calendar"
          PROBE="${GITHUB_WORKSPACE}/scripts/ci_mail_probe.py"

          # ---- PHASE 1: that database, WITHOUT our module -----------------
          odoo ${ARGS} -d ci_mail -i base --without-demo=all --log-level=warn
          odoo ${ARGS} -d ci_mail -i "${BRANDED}" --without-demo=all --log-level=warn
          odoo shell ${ARGS} -d ci_mail --no-http --log-level=warn < "${PROBE}" 2>&1 \
            | tee /tmp/mail-red.log

          grep -q "SAPIAN-MAIL leaks=" /tmp/mail-red.log \
            || { echo "::error::The red probe never reported. That is ABORTED, not red."; exit 1; }
          if grep -q "SAPIAN-MAIL leaks=0" /tmp/mail-red.log; then
            echo "::error::Without sapian_theme_mail the outgoing mail was ALREADY clean, so the scrub cannot be shown to do anything and phase 2 would prove nothing."
            exit 1
          fi
          BRANDED_N=$(sed -n 's/.*branded_templates=\([0-9][0-9]*\).*/\1/p' /tmp/mail-red.log | tail -1)
          echo "Branded templates in this database: ${BRANDED_N:-none}"
          if [ -z "${BRANDED_N:-}" ] || [ "${BRANDED_N}" -lt 8 ]; then
            echo "::error::Only ${BRANDED_N:-none} branded templates here; expected at least 8. The install list is wrong, so the sweep in the guard would prove almost nothing."
            exit 1
          fi
          echo "OK — red proof: $(grep -o 'SAPIAN-MAIL leaks=[0-9]*' /tmp/mail-red.log | tail -1) without our module."

          # ---- PHASE 2: install ours into the SAME database ---------------
          odoo ${ARGS} -d ci_mail -i sapian_theme_mail --without-demo=all \
            --test-enable --test-tags '/sapian_theme_mail:TestOutgoingDebrand' \
            --log-level=test 2>&1 | tee /tmp/mail-green.log

          grep -q "odoo\.tests\.result:" /tmp/mail-green.log \
            || { echo "::error::The guard never reported."; exit 1; }
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/mail-green.log; then
            echo "::error::Outgoing email still carries another vendor's branding."
            exit 1
          fi
          RAN=$(sed -n 's/.*tests\.result:.* of \([0-9][0-9]*\) tests.*/\1/p' /tmp/mail-green.log | tail -1)
          if [ -z "${RAN:-}" ] || [ "${RAN}" -lt 8 ]; then
            echo "::error::Expected at least 8 debrand tests, the runner reported '${RAN:-none}'. A mis-typed --test-tags selects nothing and still prints a clean result line."
            exit 1
          fi
          if grep -qE "[1-9][0-9]* skipped" /tmp/mail-green.log; then
            echo "::error::A debrand test skipped, so it proved nothing:"
            grep -E "skipped" /tmp/mail-green.log
            exit 1
          fi

          # The SAME probe, on the SAME database, now that our module is on it.
          odoo shell ${ARGS} -d ci_mail --no-http --log-level=warn < "${PROBE}" 2>&1 \
            | tee /tmp/mail-after.log
          grep -q "SAPIAN-MAIL leaks=" /tmp/mail-after.log \
            || { echo "::error::The post-install probe never reported."; exit 1; }
          if ! grep -q "SAPIAN-MAIL leaks=0" /tmp/mail-after.log; then
            echo "::error::With sapian_theme_mail installed the outgoing mail STILL names the other vendor:"
            grep "SAPIAN-MAIL leaks=" /tmp/mail-after.log
            exit 1
          fi
          echo "OK — ${RAN} tests, and the same probe went from $(grep -o 'leaks=[0-9]*' /tmp/mail-red.log | tail -1) to leaks=0 on one database."

  landing-page:
    name: The landing page agrees with its reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THREE THINGS, and the first is the one that makes the other two mean
    # something.
    #
    # 1. THE COMPARISON HAD SOMETHING TO COMPARE. Every figure test passes on a
    #    company that has posted nothing — 0.0 == 0.0, five times — and it MUST,
    #    because the page has to be right on an empty tenant too. So "was this
    #    run meaningful" is a fact about the database, and the probe asserts it
    #    here: at least three figures available AND non-zero on the demo trader,
    #    which trades through the three months ending with the last finished
    #    one — the month the page itself reads.
    # 2. Every figure equals its source report, and every absent figure says
    #    why. Run against that same populated database.
    # 3. The grid button toggles BACK to the landing page — measured in Chrome,
    #    because the defect is in a click handler and nothing in Python can see
    #    which branch of it ran.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install headless Chrome and websocket-client
        # The repository's own script, not a hand-rolled apt line: the odoo
        # image's `chromium` package does not put `chromium` on PATH, and the
        # first version of this step died on `command not found` before a
        # single test ran.
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/scripts/install_test_browser.sh"

      - name: Figures agree with their reports, on a tenant that has data
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          odoo ${ARGS} -d ci_landing -i base --log-level=warn
          odoo ${ARGS} -d ci_landing -i sapian_demo_trader,sapian_landing,web_responsive \
            --log-level=warn 2>&1 | tail -5

          # INSTALLING THE DEMO MODULE DOES NOT CREATE THE TENANT, and the
          # first version of this job assumed it did. There is no data/ or
          # demo/ entry that provisions — deliberately, see that module's
          # manifest — so `scripts/build_demo.sh` calls the provisioner by name
          # and so must this. Without it the database has Odoo's stock company
          # and nothing else, the page is correctly all-unavailable, and the
          # probe correctly refuses it. That refusal is what found this.
          echo 'env["sapian.demo.trader"]._provision_demo_tenant_on_install(); env.cr.commit(); print("SAPIAN-LANDING provisioned=%s" % env["res.company"].search_count([]))' \
            | odoo shell ${ARGS} -d ci_landing --no-http --log-level=warn 2>&1 \
            | tee /tmp/landing-provision.log
          grep -q "SAPIAN-LANDING provisioned=" /tmp/landing-provision.log \
            || { echo "::error::The demo tenant was never provisioned, so there is nothing to measure."; exit 1; }

          # ---- 1. was there anything to compare? ------------------------
          odoo shell ${ARGS} -d ci_landing --no-http --log-level=warn \
            < "${GITHUB_WORKSPACE}/scripts/ci_landing_probe.py" 2>&1 | tee /tmp/landing-probe.log
          grep -q "SAPIAN-LANDING lines=" /tmp/landing-probe.log \
            || { echo "::error::The landing probe never reported. That is ABORTED, not a result."; exit 1; }
          NONZERO=$(sed -n 's/.*nonzero=\([0-9][0-9]*\).*/\1/p' /tmp/landing-probe.log | tail -1)
          if [ -z "${NONZERO:-}" ] || [ "${NONZERO}" -lt 3 ]; then
            echo "::error::Only ${NONZERO:-none} figures were available AND non-zero on the demo tenant. The comparison below would pass over a page of zeros."
            grep "SAPIAN-LANDING" /tmp/landing-probe.log
            exit 1
          fi
          BLANK=$(sed -n 's/.*blank_without_reason=\([0-9][0-9]*\).*/\1/p' /tmp/landing-probe.log | tail -1)
          if [ "${BLANK:-1}" -ne 0 ]; then
            echo "::error::${BLANK} figure(s) are absent with no reason given — a blank cell the reader will take for zero."
            exit 1
          fi
          echo "OK — ${NONZERO} real figures on the page, every absent one explained."

          # ---- 2. every figure equals its source ------------------------
          odoo ${ARGS} -d ci_landing -u sapian_landing \
            --test-enable --test-tags '/sapian_landing:TestLandingFigures' \
            --log-level=test 2>&1 | tee /tmp/landing-tests.log
          grep -q "odoo\.tests\.result:" /tmp/landing-tests.log \
            || { echo "::error::The figure guard never reported."; exit 1; }
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/landing-tests.log; then
            echo "::error::A figure on the landing page disagrees with the report behind it."
            exit 1
          fi
          RAN=$(sed -n 's/.*tests\.result:.* of \([0-9][0-9]*\) tests.*/\1/p' /tmp/landing-tests.log | tail -1)
          if [ -z "${RAN:-}" ] || [ "${RAN}" -lt 17 ]; then
            echo "::error::Expected at least 17 landing tests, the runner reported '${RAN:-none}'."
            exit 1
          fi
          if grep -qE "[1-9][0-9]* skipped" /tmp/landing-tests.log; then
            echo "::error::A landing test skipped, so it proved nothing:"
            grep -E "skipped" /tmp/landing-tests.log
            exit 1
          fi
          echo "OK — ${RAN} figure tests."

      - name: The grid button toggles back to the landing page
        shell: bash
        run: |
          set -uo pipefail
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"
          odoo ${ARGS} -d ci_landing -u sapian_landing \
            --test-enable --test-tags '/sapian_landing:TestGridTogglesBackToTheLanding' \
            --log-level=test 2>&1 | tee /tmp/landing-grid.log

          grep -q "odoo\.tests\.result:" /tmp/landing-grid.log \
            || { echo "::error::The grid test never reported. That is ABORTED, not red."; exit 1; }
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/landing-grid.log; then
            echo "::error::The grid button does not toggle back to the landing page."
            exit 1
          fi
          # THE BROWSER'S OWN LINE. A `-standard` test that was never selected
          # reports a clean result over zero tests, and this is the only thing
          # that distinguishes "it toggled" from "it never ran".
          grep -q "SAPIAN-GRID toggled=2 landed=overview" /tmp/landing-grid.log \
            || { echo "::error::The browser never reported the toggle, so nothing was measured."; exit 1; }
          echo "OK — the launcher opens over the overview and closes back onto it."

  auth-controls-palette:
    name: Every auth control is in the palette
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE JOB THAT DID NOT EXIST, and whose absence is half the defect.
    #
    # sapian_theme carried TestEveryControlIsInThePalette tagged
    # `-standard, sapian_palette`, with a docstring saying "the CI job greps for
    # that line, so a skipped run cannot pass". `grep -rn sapian_palette` over
    # the whole repository matched that file and nothing else: no job selected
    # the tag, so the guard had never run once. Meanwhile it read only `color`
    # and `background-color`, on `a, button, .btn, input[type=submit],
    # [role=button], summary` — and asserted nothing at all.
    #
    # An operator then found a PURPLE FOCUS OUTLINE on the email input of
    # /web/reset_password while every other auth check reported the page clean.
    # A plain input is in none of those selectors, an outline is in neither of
    # those properties, and nothing in the JS could fail.
    #
    # auth_signup is installed because /web/reset_password is its route — the
    # page the defect was seen on.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install headless Chrome and websocket-client
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/scripts/install_test_browser.sh"

      - name: Enumerate every control on both auth pages, in every state
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          odoo ${ARGS} -d ci_palette -i base --without-demo=all --log-level=warn
          # THE OPERATOR'S SHAPE, and the only one where the leak can appear.
          #
          # Run 190 built sapian_theme + auth_signup and reported foreign=0 —
          # on a database where there is nothing to find. `html_editor` is
          # auto_install with `website` and rebuilds Bootstrap's $theme-colors
          # from the website editor palette, which is what stops
          # $o-brand-primary reaching the frontend bundle. Without website
          # installed the brand reaches every control and the guard measures a
          # tenant nobody runs.
          odoo ${ARGS} -d ci_palette -i sapian_theme,auth_signup,website,website_sale \
            --without-demo=all \
            --test-enable --test-tags 'sapian_palette' \
            --log-level=test 2>&1 | tee /tmp/palette.log
          RC=${PIPESTATUS[0]}

          echo "---- EVERY CONTROL, EVERY STATE ----"
          grep -F 'SAPIAN-CONTROL ' /tmp/palette.log | sed 's/^.*SAPIAN-CONTROL /SAPIAN-CONTROL /' || true
          echo "---- SUMMARY ----"
          grep -F 'SAPIAN-CONTROL-SUMMARY' /tmp/palette.log | sed 's/^.*SAPIAN-CONTROL-SUMMARY/SUMMARY/' || true
          echo "---- FOREIGN ONLY ----"
          grep -F 'SAPIAN-CONTROL ' /tmp/palette.log | grep -F 'FOREIGN' || echo "(none)"

          # THE BROWSER ACTUALLY RAN AND REPORTED, ON BOTH PAGES, BY NAME.
          #
          # The first version counted `grep -cF SAPIAN-CONTROL-SUMMARY` and got
          # 2 from ONE real summary plus the line where Odoo echoes the injected
          # JavaScript, which contains that string as source text. The floor was
          # met by the script quoting itself. Match the rendered form —
          # `path=/web/...` — and require each route by name, so neither a
          # source echo nor a single-page run can satisfy it.
          for route in /web/login /web/reset_password; do
            if ! grep -qF "SAPIAN-CONTROL-SUMMARY path=${route} " /tmp/palette.log; then
              echo "::error::No palette summary for ${route}. That page was not audited, so this job proves nothing about it."
              exit 1
            fi
          done
          SUMMARIES=$(grep -cE 'SAPIAN-CONTROL-SUMMARY path=/web/' /tmp/palette.log || true)
          echo "summary lines (rendered, not source echo): ${SUMMARIES}"
          if ! grep -q "odoo\.tests\.result:" /tmp/palette.log; then
            echo "::error::The test runner never reported a result line — no tests were executed."
            exit 1
          fi
          SKIPPED=$(grep -c 'skipped' /tmp/palette.log || true)
          echo "skip mentions in the log: ${SKIPPED}"

          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/palette.log; then
            echo "::error::A control on an auth page wears a colour outside the palette — see the FOREIGN lines above."
            exit 1
          fi
          [ "${RC}" -eq 0 ] || { echo "::error::The palette run exited ${RC}."; exit 1; }
          echo "OK — every enumerated control state is neutral or in the palette."

  verification-crosses-a-dbfilter:
    name: Verification reaches the database it just built
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE DEFECT NO CI JOB COULD HAVE CAUGHT, because every job here runs with
    # no dbfilter at all.
    #
    # The operator's config/odoo.runtime.conf pins `dbfilter = demo_allapps`.
    # build_demo.sh then built `demo_v4`. Odoo's Request._get_session_and_dbname
    # runs db_filter([session.db]) on every request and LOGS THE SESSION OUT
    # when the filter rejects it, so the verifier's authenticated fetch of
    # /odoo arrived anonymous, was redirected to /web/login, and `website`
    # rendered that login page. Every launcher check was then read off a page
    # that could not contain a launcher.
    #
    # This job drives the REAL verify_launcher and verify_login_page from
    # preflight.sh — not a copy — against a database the configured dbfilter
    # deliberately does not match, through a stub that stands in for
    # `docker compose run`. Two phases, and the first one is the point:
    #
    #   RED   the fix stripped out: launcher_measured=0 is REQUIRED. If the
    #         defect cannot be reproduced here, this job is decoration.
    #   GREEN the fix in place: launcher_measured=1 and a real reading.
    #
    # Asserting the red phase is what stops this becoming another check that
    # passes by doing nothing.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: A pinned dbfilter that does not match the database under test
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0"

          # The tenant. Named so the filter below cannot match it by accident.
          odoo ${ARGS} --stop-after-init -d ci_pinned -i base --without-demo=all --log-level=warn
          odoo ${ARGS} --stop-after-init -d ci_pinned \
            -i sapian_demo_trader,sapian_theme,web_responsive \
            --without-demo=all --log-level=warn
          echo 'env["res.users"]._sapian_apply_launcher_defaults(dry_run=False); env.cr.commit(); print("SAPIAN-PIN defaults applied")' \
            | odoo shell ${ARGS} --stop-after-init -d ci_pinned --no-http --log-level=warn 2>&1 | tee /tmp/pin-defaults.log
          grep -q "SAPIAN-PIN defaults applied" /tmp/pin-defaults.log \
            || { echo "::error::The defaults step never reported; this job measured nothing."; exit 1; }

          # THE OPERATOR'S CONFIGURATION, in the file preflight.sh reads and in
          # the file Odoo reads. `demo_allapps` is a database that does not
          # exist here, exactly as on his machine.
          mkdir -p "${GITHUB_WORKSPACE}/config"
          printf '[options]\ndbfilter = demo_allapps\n' \
            > "${GITHUB_WORKSPACE}/config/odoo.runtime.conf"
          printf '[options]\ndbfilter = demo_allapps\n' > /tmp/pinned.conf

          # THE STUB FOR `docker compose run --rm -T odoo`. preflight.sh calls
          # `${compose} run --rm -T odoo odoo shell ...`; this drops those four
          # tokens, runs the rest, and adds the pinned config plus the database
          # connection. stdin passes straight through, which is how the checker
          # scripts are fed.
          cat > /tmp/compose-stub <<STUB
          #!/usr/bin/env bash
          shift 4
          exec "\$@" -c /tmp/pinned.conf --db_host=db --db_port=5432 --db_user=odoo \
               --db_password=odoo --data-dir=/tmp/odoo-data \
               --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons \
               --workers=0 --max-cron-threads=0 --log-level=warn
          STUB
          chmod +x /tmp/compose-stub

          # ---- PHASE 1: RED. The fix removed, the defect required. ----------
          cp scripts/lib/preflight.sh /tmp/preflight.orig
          python3 - <<'PYEOF'
          import re
          path = "scripts/lib/preflight.sh"
          source = open(path).read()
          # Strip the override exactly: the flags variable becomes empty.
          patched = source.replace(
              'dbfilter_args="$(verifying_dbfilter_args "${db}" "${repo_root}")"',
              'dbfilter_args=""',
          )
          assert patched != source, "the override is not where this job thinks it is"
          open(path, "w").write(patched)
          PYEOF

          set +e
          bash -c '. scripts/lib/preflight.sh; verify_launcher /tmp/compose-stub ci_pinned "${GITHUB_WORKSPACE}"' \
            > /tmp/red.log 2>&1
          RED_RC=$?
          set -e
          echo "---- RED phase (fix removed) ----"
          grep -E '^CHECK |COULD NOT MEASURE' /tmp/red.log || true
          echo "red rc=${RED_RC}"
          grep -q '^CHECK launcher_measured=0' /tmp/red.log \
            || { echo "::error::RED phase did not reproduce the defect — no launcher_measured=0. Without the defect reproducing, the green phase below proves nothing."; cat /tmp/red.log; exit 1; }
          grep -q 'COULD NOT MEASURE the launcher' /tmp/red.log \
            || { echo "::error::RED phase produced launcher_measured=0 but verify_launcher did not report it as unmeasurable."; exit 1; }
          [ "${RED_RC}" -ne 0 ] \
            || { echo "::error::RED phase exited 0 — a verification that could not measure must fail."; exit 1; }

          # ---- PHASE 2: GREEN. The fix restored, a real reading required. ---
          cp /tmp/preflight.orig scripts/lib/preflight.sh
          set +e
          bash -c '. scripts/lib/preflight.sh; verify_launcher /tmp/compose-stub ci_pinned "${GITHUB_WORKSPACE}"' \
            > /tmp/green.log 2>&1
          GREEN_RC=$?
          bash -c '. scripts/lib/preflight.sh; verify_login_page /tmp/compose-stub ci_pinned "${GITHUB_WORKSPACE}"' \
            > /tmp/green-login.log 2>&1
          GREEN_LOGIN_RC=$?
          set -e
          echo "---- GREEN phase (fix in place) ----"
          grep -E '^CHECK |^>> NOTE' /tmp/green.log || true
          echo "launcher rc=${GREEN_RC}"
          echo "---- GREEN phase, login page ----"
          grep -E '^CHECK ' /tmp/green-login.log || true
          echo "login rc=${GREEN_LOGIN_RC}"

          grep -q '^CHECK launcher_measured=1' /tmp/green.log \
            || { echo "::error::The verification still could not reach ci_pinned through the pinned dbfilter."; cat /tmp/green.log; exit 1; }
          # A REAL READING, not merely "it measured". The whole point is that
          # the fetch reached the backend and found the launcher there.
          grep -q '^CHECK launcher_js_named=True' /tmp/green.log \
            || { echo "::error::The fetch reached the backend but the launcher component is not in the served JS."; exit 1; }
          grep -q '^CHECK launcher_backend_js_bundles=1' /tmp/green.log \
            || { echo "::error::No backend JS bundle in the green phase."; exit 1; }
          grep -q '^CHECK launcher_css_sapian_theme=True' /tmp/green.log \
            || { echo "::error::sapian_theme CSS missing in the green phase."; exit 1; }
          [ "${GREEN_RC}" -eq 0 ] \
            || { echo "::error::verify_launcher still failed with the fix in place."; cat /tmp/green.log; exit 1; }

          # The login page had the SAME hole: its fetch is anonymous, so with a
          # non-matching dbfilter Odoo resolves no database for the request at
          # all. 200 with the real page is the proof it crosses the pin too.
          grep -q '^CHECK login_http=200' /tmp/green-login.log \
            || { echo "::error::The login-page verification did not reach ci_pinned through the pinned dbfilter."; cat /tmp/green-login.log; exit 1; }
          grep -q '^CHECK login_primary=#14454F' /tmp/green-login.log \
            || { echo "::error::The login page was reached but is not brand-coloured."; exit 1; }

          # The operator is TOLD about the conflict, on stderr, without the
          # config or the running server being touched.
          grep -q 'pins dbfilter = demo_allapps, which does NOT match' /tmp/green.log \
            || { echo "::error::The dbfilter conflict was overridden silently — the operator would never learn their config disagrees with what they built."; exit 1; }
          grep -q '^dbfilter = demo_allapps$' "${GITHUB_WORKSPACE}/config/odoo.runtime.conf" \
            || { echo "::error::The operator's config file was modified. The override must apply to one process, not to their configuration."; exit 1; }

          echo "OK — the defect reproduces without the fix and the verification crosses the pin with it."

  launcher-with-website:
    name: The launcher survives an all-apps database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE CONFIGURATION NOTHING HAS EVER TESTED.
    #
    # `./scripts/build_demo.sh <db> sapian_demo_trader --all-apps` fails its own
    # step [5/5] on a fresh database: launcher_backend_js_bundles=0, and every
    # check below that is downstream of the zero. It reports "No backend JS
    # bundle was served — the fetch did not reach the web client, so a clean
    # result here would mean nothing", which is the verifier admitting it may
    # have measured nothing at all.
    #
    # The existing launcher job installs sapian_demo_trader, sapian_theme and
    # web_responsive. --all-apps installs the whole product catalogue — 38
    # modules, ~233 with dependencies, including point_of_sale, im_livechat,
    # mass_mailing, mrp, survey and the website family, several of which own
    # asset bundles and their own ir.http dispatch. No job has ever combined
    # them with the launcher, so the failure could not have been caught here.
    # That gap is the reason this job exists, independently of what the
    # diagnosis turns out to be.
    #
    # An earlier revision installed only website and website_sale and came back
    # green on every check, control-identical. That REFUTED the website
    # hypothesis; it did not reproduce anything. The list is read from the
    # catalogue now so the job builds the set the operator actually builds.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build an all-apps-shaped database and run the real verifier
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/odoo-data
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/vendor/oca_web,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          odoo ${ARGS} -d ci_allapps -i base --without-demo=all --log-level=warn

          odoo ${ARGS} -d ci_allapps \
            -i sapian_demo_trader,sapian_theme,web_responsive \
            --without-demo=all --log-level=warn

          # Apply the launcher defaults exactly as provisioning does, and in the
          # SAME PLACE: build_demo.sh applies them at [4], BEFORE --all-apps
          # installs the catalogue at [4b]. Applying them afterwards would
          # measure a tenant no operator has, and would hide any interaction
          # between a later install and the two per-user settings.
          echo 'env["res.users"]._sapian_apply_launcher_defaults(dry_run=False); env.cr.commit(); print("SAPIAN-ALLAPPS defaults applied")' \
            | odoo shell ${ARGS} -d ci_allapps --no-http --log-level=warn 2>&1 | tee /tmp/allapps-defaults.log
          grep -q "SAPIAN-ALLAPPS defaults applied" /tmp/allapps-defaults.log \
            || { echo "::error::The launcher defaults step never reported — nothing below measures the shipped tenant."; exit 1; }

          # THE REAL --all-apps SET, read from the model rather than retyped.
          #
          # The first version of this job installed website and website_sale and
          # called that "all-apps shaped". It was not, and it came back entirely
          # green: 1 backend bundle, 16 web_responsive modules, both stylesheets
          # — identical to the control. Five modules is not 38, so that run
          # refuted the website hypothesis and reproduced nothing.
          #
          # build_demo.sh installs `sapian.module.catalog`'s technical_names,
          # which are seeded from STANDARD_CATALOG on the model. Reading the
          # class attribute gives the same list without needing the onboarding
          # wizard to have run, and it cannot drift from the list the product
          # actually ships.
          echo 'print(">> catalog_list=%s" % ",".join(sorted({e[1] for e in env["sapian.module.catalog"].STANDARD_CATALOG})))' \
            | odoo shell ${ARGS} -d ci_allapps --no-http --log-level=warn 2>&1 | tee /tmp/allapps-catalog.log
          CATALOG_LIST="$(sed -n 's/^>> catalog_list=//p' /tmp/allapps-catalog.log | tr -d '\r')"
          CATALOG_COUNT="$(echo "${CATALOG_LIST}" | tr ',' '\n' | grep -c . || echo 0)"
          echo "catalogue reports ${CATALOG_COUNT} modules"
          # A FLOOR, because an empty list would install nothing, exit 0, and
          # hand back the launcher-stack database presented as the all-apps one.
          if [ "${CATALOG_COUNT}" -lt 30 ]; then
            echo "::error::The catalogue reported ${CATALOG_COUNT} modules — this is not the all-apps set."
            exit 1
          fi
          odoo ${ARGS} -d ci_allapps -i "${CATALOG_LIST}" \
            --without-demo=all --log-level=warn

          # THE DISCRIMINATOR. check_launcher.py measures the fetch; this asks
          # the asset pipeline directly. Both defects show the same zero in the
          # verifier, and only these two readings side by side separate them.
          odoo shell ${ARGS} -d ci_allapps --no-http --log-level=warn \
               < "${GITHUB_WORKSPACE}/scripts/ci_probe_assets.py" 2>&1 | tee /tmp/allapps-probe.log
          grep -q '^PROBE probe_finished=1' /tmp/allapps-probe.log \
            || { echo "::error::The asset probe never finished — it measured nothing."; exit 1; }
          echo "---- PROBE (all-apps db) ----"
          grep '^PROBE ' /tmp/allapps-probe.log

          # THE REAL VERIFIER, unmodified, under --no-http exactly as
          # build_demo.sh step [5/5] runs it.
          odoo shell ${ARGS} -d ci_allapps --no-http --log-level=warn \
               < "${GITHUB_WORKSPACE}/scripts/lib/check_launcher.py" 2>&1 | tee /tmp/allapps-launcher.log

          echo "---- every CHECK the verifier produced ----"
          grep -E '^(CHECK|NOTE) ' /tmp/allapps-launcher.log || true

          # THIS JOB IS DIAGNOSTIC FIRST. It must not go green by failing to
          # measure, so the one thing asserted right now is that the verifier
          # RAN and reported. Whether the bundles are present is the question
          # under investigation, and the answer is read from the CHECK lines
          # above rather than asserted before it is known.
          grep -q '^CHECK launcher_page_http=' /tmp/allapps-launcher.log \
            || { echo "::error::The verifier never reported a page status — it did not run, so this job measured nothing."; exit 1; }
          grep -q '^CHECK launcher_backend_js_bundles=' /tmp/allapps-launcher.log \
            || { echo "::error::The verifier never reported a bundle count."; exit 1; }
          # ---- THE CONTROL, and without it a red above proves nothing -------
          #
          # "Same code, different result" needs the two results side by side. If
          # this job only built the all-apps database and it came back zero, the
          # zero could as easily be this job's setup as the catalogue. So the
          # identical verifier runs against an identical database carrying only
          # the launcher stack, and the two are printed together.
          odoo ${ARGS} -d ci_nowebsite -i base --without-demo=all --log-level=warn
          odoo ${ARGS} -d ci_nowebsite \
            -i sapian_demo_trader,sapian_theme,web_responsive \
            --without-demo=all --log-level=warn
          echo 'env["res.users"]._sapian_apply_launcher_defaults(dry_run=False); env.cr.commit(); print("SAPIAN-ALLAPPS defaults applied")' \
            | odoo shell ${ARGS} -d ci_nowebsite --no-http --log-level=warn 2>&1 | tee /tmp/nowebsite-defaults.log
          grep -q "SAPIAN-ALLAPPS defaults applied" /tmp/nowebsite-defaults.log \
            || { echo "::error::The CONTROL launcher defaults step never reported — the control is not the shipped tenant either."; exit 1; }
          odoo shell ${ARGS} -d ci_nowebsite --no-http --log-level=warn \
               < "${GITHUB_WORKSPACE}/scripts/ci_probe_assets.py" 2>&1 | tee /tmp/nowebsite-probe.log
          grep -q '^PROBE probe_finished=1' /tmp/nowebsite-probe.log \
            || { echo "::error::The CONTROL asset probe never finished."; exit 1; }
          echo "---- PROBE (control db) ----"
          grep '^PROBE ' /tmp/nowebsite-probe.log

          odoo shell ${ARGS} -d ci_nowebsite --no-http --log-level=warn \
               < "${GITHUB_WORKSPACE}/scripts/lib/check_launcher.py" 2>&1 | tee /tmp/nowebsite-launcher.log

          echo "---- CONTROL (launcher stack only): every CHECK ----"
          grep -E '^(CHECK|NOTE) ' /tmp/nowebsite-launcher.log || true

          # ---- THE LOGIN COLOURS, on the same two databases -----------------
          #
          # The operator's --all-apps run also reported login_primary,
          # login_disabled and login_focus_rgb as ABSENT. Those come from
          # check_login_page.py, which reads the COMPILED web.assets_frontend
          # bundle rather than any fetched page — so unlike the launcher checks
          # they are not downstream of the wrong-page fetch, and they have to
          # be measured separately rather than dismissed with it.
          #
          # No session is involved, so CI can run the real file unmodified.
          for db in ci_allapps ci_nowebsite; do
            odoo shell ${ARGS} -d "${db}" --no-http --log-level=warn \
                 < "${GITHUB_WORKSPACE}/scripts/lib/check_login_page.py" 2>&1 \
                 | tee "/tmp/${db}-login.log"
            grep -q '^CHECK login_http=' "/tmp/${db}-login.log" \
              || { echo "::error::The login check never reported on ${db} — it measured nothing."; exit 1; }
          done
          echo "---- THE COMPARISON (login colours) ----"
          for key in brand_expected brand_expected_rgb login_rule_scope login_primary login_disabled \
                     login_focus_rgb login_css_bytes login_selector_oe_login_form \
                     login_selector_o_sapian_auth login_scope_o_sapian_auth_any; do
            printf '%-32s allapps=%-14s control=%s\n' "${key}" \
              "$(sed -n "s/^CHECK ${key}=//p" /tmp/ci_allapps-login.log | head -1)" \
              "$(sed -n "s/^CHECK ${key}=//p" /tmp/ci_nowebsite-login.log | head -1)"
          done
          sed -n 's/^CHECK login_actual_rule=/allapps actual rule: /p' /tmp/ci_allapps-login.log | head -1

          echo "---- THE COMPARISON ----"
          echo "---- THE COMPARISON (asset pipeline, no HTTP) ----"
          for b in web.assets_web web.assets_backend; do
            printf 'bundle %-20s allapps=%-60s control=%s\n' "${b}" \
              "$(sed -n "s/^PROBE bundle_${b} //p" /tmp/allapps-probe.log | head -1)" \
              "$(sed -n "s/^PROBE bundle_${b} //p" /tmp/nowebsite-probe.log | head -1)"
          done

          for key in launcher_page_http launcher_page_bytes launcher_backend_js_bundles \
                     launcher_backend_css_bundles launcher_js_modules \
                     launcher_css_web_responsive launcher_css_sapian_theme; do
            printf '%-34s allapps=%-14s control=%s\n' "${key}" \
              "$(sed -n "s/^CHECK ${key}=//p" /tmp/allapps-launcher.log | head -1)" \
              "$(sed -n "s/^CHECK ${key}=//p" /tmp/nowebsite-launcher.log | head -1)"
          done

          grep -q '^CHECK launcher_backend_js_bundles=' /tmp/nowebsite-launcher.log \
            || { echo "::error::The CONTROL verifier never reported, so the comparison is void."; exit 1; }
          echo "OK — both verifiers ran and reported; read the comparison above."

