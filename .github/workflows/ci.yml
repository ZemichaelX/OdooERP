name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-fast-tests:
    name: Lint + reference golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --quiet ruff black pylint pylint-odoo pytest python-dateutil

      - name: Lint (ruff, black, pylint-odoo)
        # ONE DEFINITION, shared with the pre-push hook: .githooks/pre-push runs
        # this same script. Both the floors ("is there anything to lint at all")
        # and the three tools live in it, and it gates on EXIT CODES.
        #
        # It replaces three separate `run:` steps plus a floors step. Those were
        # not wrong, but they were a second definition of lint that a developer
        # could not run, and the gap showed: a pylint warning that a local run
        # had already produced reached CI, because the local check read pylint's
        # "rated at 10.00/10" instead of its exit status of 4.
        run: bash scripts/lint.sh

      - name: Reference calculator golden tests (no Odoo needed)
        # pytest exits 5 when it collects NOTHING, so the total-wipe case is
        # already covered. The floor catches the partial one: a renamed test
        # module or a broken import taking most of the suite with it still
        # reports "12 passed" and exits 0.
        run: |
          set -euo pipefail
          MIN_FAST_TESTS=100   # 107 at this commit
          pytest tests_fast/ -q | tee /tmp/fast-tests.log
          passed=$(grep -oE '[0-9]+ passed' /tmp/fast-tests.log | tail -1 | grep -oE '^[0-9]+' || true)
          passed=${passed:-0}
          echo "Fast golden tests passed: ${passed} (floor ${MIN_FAST_TESTS})"
          if [ "${passed}" -lt "${MIN_FAST_TESTS}" ]; then
            echo "::error::Only ${passed} fast tests passed, expected at least ${MIN_FAST_TESTS}. The suite did not run — this is a failure, not a pass."
            exit 1
          fi

      - name: Validate XML, CSV and manifests
        run: |
          python - <<'EOF'
          import ast
          import csv
          import glob
          import xml.etree.ElementTree as ET

          # Count what was actually validated and report it. "OK" printed after
          # looping over an empty glob is a success signal produced by doing
          # nothing — the exact shape this repo keeps getting caught by.
          MIN_XML, MIN_CSV, MIN_MANIFESTS = 30, 5, 5   # 46 / 9 / 9 at this commit

          xml_count = 0
          for path in glob.glob("addons/**/*.xml", recursive=True):
              ET.parse(path)
              xml_count += 1
          csv_count = 0
          for path in glob.glob("addons/**/*.csv", recursive=True):
              with open(path, newline="", encoding="utf-8") as handle:
                  widths = {len(row) for row in csv.reader(handle)}
                  assert len(widths) == 1, f"ragged CSV: {path}"
              csv_count += 1
          manifest_count = 0
          for path in glob.glob("addons/*/__manifest__.py"):
              with open(path, encoding="utf-8") as handle:
                  ast.literal_eval(handle.read())
              manifest_count += 1

          print(f"validated {xml_count} XML, {csv_count} CSV, {manifest_count} manifests")
          assert xml_count >= MIN_XML, f"only {xml_count} XML files validated (floor {MIN_XML})"
          assert csv_count >= MIN_CSV, f"only {csv_count} CSV files validated (floor {MIN_CSV})"
          assert manifest_count >= MIN_MANIFESTS, (
              f"only {manifest_count} manifests validated (floor {MIN_MANIFESTS})"
          )
          print("XML/CSV/manifests OK")
          EOF

  integration-tests:
    name: Odoo integration tests
    runs-on: ubuntu-latest
    # Run inside the same Odoo 19 image production uses, so the suite exercises
    # the real ORM/registry/report stack (A3). A DB failure here fails CI.
    # Images are pinned by DIGEST (R7): the 19.0/16 tags are rebuilt upstream
    # continuously, and an unannounced rebuild silently changed core behaviour
    # under us once already. Upgrading an image is a deliberate, tested change
    # — bump the digest in its own PR and let this suite prove it.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the Odoo integration suites (with demo data)
        # The odoo:19.0 image's default shell is dash (no `pipefail`); force
        # bash, whose GitHub wrapper already runs with `-eo pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          # Install the two demo tenants: they pull in every product module
          # (sapian_core, l10n_et_base/payroll/reports, vertical_pharma) so
          # --test-enable runs the whole suite. --workers=0 is required for the
          # HttpCase web tests. A failing test makes odoo exit non-zero → CI red.
          #
          # sapian_dress_rehearsal is here because it was NOT, and that is how
          # its provisioner stayed broken for a week: scripts/dress_rehearsal.sh
          # is run by hand, CI never touched the module, and the one guard that
          # could have caught it did not exist. It is an internal QA module and
          # never ships to a client (scripts/check_no_demo_modules.sh enforces
          # that separately); installing it on a scratch CI database is free.
          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_test \
            -i sapian_demo_trader,sapian_demo_pharma,sapian_theme,sapian_dress_rehearsal,l10n_et_calendar,l10n_et_calendar_account,l10n_et_calendar_purchase \
            --test-enable \
            --test-tags '/sapian_core,/l10n_et_base,/l10n_et_payroll,/l10n_et_reports,/vertical_pharma,/sapian_demo_trader,/sapian_demo_pharma,/sapian_theme,/sapian_dress_rehearsal,/l10n_et_calendar,/l10n_et_calendar_account,/l10n_et_calendar_purchase' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/odoo-test.log
          # `set -o pipefail` already makes a non-zero odoo exit fail this step.
          # Belt and braces: also fail on Odoo's own result line reporting any
          # failed or errored test (matches "N failed" or "0 failed, N error(s)"
          # but not the clean "0 failed, 0 error(s)").
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/odoo-test.log; then
            echo "::error::Odoo integration tests reported failures"
            exit 1
          fi

          # A GREEN EXIT CODE IS NOT PROOF THAT ANYTHING RAN.
          # Every check above this line asks "did a test fail?" — and a run that
          # executes ZERO tests answers "no" to all of them. That is not a
          # hypothetical: it happened locally, where a failed database drop left
          # the modules already installed, so `-i` was a no-op, `--test-enable`
          # had nothing to select, 10 tests ran instead of 222, and the command
          # exited 0. The only tell was an empty stats block. In CI the same
          # shape can come from a renamed module, a typo in --test-tags, or an
          # install that silently does nothing.
          #
          # So assert the positive: the runner reported, and it ran a full suite.
          if ! grep -q "odoo\.tests\.result:" /tmp/odoo-test.log; then
            echo "::error::The Odoo test runner never reported a result line — no tests were executed. A suite that runs nothing must not report success."
            exit 1
          fi
          # MIN_EXPECTED_TESTS is a FLOOR, not the exact count (418 at this
          # commit, after the social welfare levy).
          # Raise it as the suite grows. Only ever
          # lower it in a commit that says which tests went away and why —
          # lowering it to make CI pass is how this guard gets quietly disabled.
          #
          # NOTE: this job has no browser, so the app rail's browser_js tests
          # skip here. They are covered by the `rail-render` job, which installs
          # Chrome and fails if the browser did not actually report.
          MIN_EXPECTED_TESTS=350
          EXECUTED=$(grep -oE "odoo\.tests\.stats: [A-Za-z0-9_]+: [0-9]+ tests" /tmp/odoo-test.log \
                     | awk '$4 == "tests" { total += $3 } END { print total + 0 }')
          echo "Executed ${EXECUTED} tests (floor ${MIN_EXPECTED_TESTS}):"
          grep -oE "odoo\.tests\.stats: [A-Za-z0-9_]+: [0-9]+ tests" /tmp/odoo-test.log | sed 's/^/  /'
          if [ "${EXECUTED}" -lt "${MIN_EXPECTED_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} tests executed, expected at least ${MIN_EXPECTED_TESTS}. The suite did not run — this is a failure, not a pass."
            exit 1
          fi

  calendar-standalone:
    name: Calendar installs, and uninstalls, alone
    runs-on: ubuntu-latest
    # WHY A SEPARATE JOB.
    #
    # l10n_et_calendar's central claim is that it stands ALONE: a client who
    # wants Ethiopian dates on a purchase order must not be handed a chart of
    # accounts with them. The integration job installs it beside every other
    # module we ship, so it cannot tell the difference between "depends on base
    # and base_setup" and "happens to work because l10n_et_base was already
    # there". This job installs it on a database that has nothing else of ours
    # on it at all.
    #
    # It also exercises UNINSTALL. An uninstall that leaves columns behind is
    # invisible until a client asks to remove the module, which is exactly when
    # nobody wants to be debugging.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install alone, run its tests, uninstall, reinstall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          # Flags only, so the same set can be handed to `odoo` and to
          # `odoo shell` (the subcommand has to come first).
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"

          # 1. install alone, with its tests
          odoo ${ARGS} -d ci_calendar -i l10n_et_calendar \
            --test-enable --test-tags '/l10n_et_calendar' \
            --log-level=test 2>&1 | tee /tmp/calendar.log

          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/calendar.log; then
            echo "::error::l10n_et_calendar tests failed."
            exit 1
          fi
          # A GREEN EXIT CODE IS NOT PROOF THAT ANYTHING RAN. Assert the count.
          MIN_CALENDAR_TESTS=25          # 27 at this commit
          EXECUTED=$(grep -oE "odoo\.tests\.stats: l10n_et_calendar: [0-9]+ tests" /tmp/calendar.log \
                     | grep -oE "[0-9]+ tests" | grep -oE "[0-9]+" | tail -1 || echo 0)
          echo "Executed ${EXECUTED} calendar tests (floor ${MIN_CALENDAR_TESTS})"
          if [ "${EXECUTED}" -lt "${MIN_CALENDAR_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} calendar tests executed — the suite did not run."
            exit 1
          fi

          # 2. nothing else of ours came along for the ride. Asserted against
          #    the database, not the manifest: ir_module_module knows what is
          #    actually installed. The marker is printed by the shell itself,
          #    so an odoo shell that died before running anything cannot pass
          #    this by producing no output.
          echo 'print("SAPIAN-CAL others=%s" % sorted(n for n in env["ir.module.module"].search([("state","=","installed")]).mapped("name") if n.startswith(("sapian_", "l10n_et_"))))' \
            | odoo shell ${ARGS} -d ci_calendar --log-level=warn 2>&1 | tee /tmp/calendar-alone.log
          grep -q "SAPIAN-CAL others=" /tmp/calendar-alone.log \
            || { echo "::error::The odoo shell never reported — the standalone check ran nothing."; exit 1; }
          if ! grep -q "SAPIAN-CAL others=\['l10n_et_calendar'\]" /tmp/calendar-alone.log; then
            echo "::error::l10n_et_calendar is not alone on this database:"
            grep "SAPIAN-CAL others=" /tmp/calendar-alone.log
            exit 1
          fi

          # 3. uninstall, and prove the columns went with it
          echo 'env["ir.module.module"].search([("name","=","l10n_et_calendar")]).button_immediate_uninstall(); env.cr.commit()' \
            | odoo shell ${ARGS} -d ci_calendar --log-level=warn 2>&1 | tail -3
          echo 'env.cr.execute("SELECT column_name FROM information_schema.columns WHERE table_name = %s", ("res_company",)); print("SAPIAN-CAL leftover=%d" % len([c for (c,) in env.cr.fetchall() if c.startswith("l10n_et_")])); env.cr.execute("SELECT state FROM ir_module_module WHERE name = %s", ("l10n_et_calendar",)); print("SAPIAN-CAL state=%s" % env.cr.fetchone()[0])' \
            | odoo shell ${ARGS} -d ci_calendar --log-level=warn 2>&1 | tee /tmp/calendar-uninstall.log
          grep -E "SAPIAN-CAL (leftover|state)=" /tmp/calendar-uninstall.log | sed 's/^/  /'
          grep -q "SAPIAN-CAL state=uninstalled" /tmp/calendar-uninstall.log \
            || { echo "::error::The module did not reach state 'uninstalled'."; exit 1; }
          grep -q "SAPIAN-CAL leftover=0" /tmp/calendar-uninstall.log \
            || { echo "::error::Uninstall left l10n_et_ columns behind on res_company."; exit 1; }

          # 4. and it goes back on afterwards
          odoo ${ARGS} -d ci_calendar -i l10n_et_calendar \
            --test-enable --test-tags '/l10n_et_calendar' \
            --log-level=test 2>&1 | tee /tmp/calendar-again.log
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/calendar-again.log; then
            echo "::error::l10n_et_calendar failed on reinstall."
            exit 1
          fi
          grep -q "odoo\.tests\.stats: l10n_et_calendar: " /tmp/calendar-again.log \
            || { echo "::error::No calendar tests ran on reinstall."; exit 1; }

      - name: A bridge appears only when BOTH its sides are present
        shell: bash
        # auto_install is a claim about what happens on somebody else's
        # database, and "it worked on mine" is not evidence: the interesting
        # case is the one where a bridge appears where it should not, on a
        # client who installed Accounting and never asked for a calendar.
        #
        # So this walks the three states on a separate database and asserts the
        # module states at each one, rather than asserting the manifests say
        # auto_install: True — which they would say either way.
        run: |
          set -euo pipefail
          ARGS="--db_host=db --db_port=5432 --db_user=odoo --db_password=odoo
                --data-dir=/tmp/odoo-data
                --addons-path=${GITHUB_WORKSPACE}/addons,/usr/lib/python3/dist-packages/odoo/addons
                --workers=0 --max-cron-threads=0 --stop-after-init"
          PROBE='print("SAPIAN-BRIDGE " + " ".join("%s=%s" % (m.name, m.state) for m in env["ir.module.module"].search([("name","in",["account","purchase","l10n_et_calendar","l10n_et_calendar_account","l10n_et_calendar_purchase"])], order="name")))'

          expect () {   # expect <label> <expected SAPIAN-BRIDGE line>
            echo "${PROBE}" | odoo shell ${ARGS} -d ci_bridges --log-level=warn 2>&1 \
              | tee /tmp/bridge.log >/dev/null
            grep -q "SAPIAN-BRIDGE " /tmp/bridge.log \
              || { echo "::error::[$1] the shell never reported — nothing was checked."; exit 1; }
            ACTUAL=$(grep -o "SAPIAN-BRIDGE .*" /tmp/bridge.log | tail -1)
            echo "  [$1] ${ACTUAL}"
            if [ "${ACTUAL}" != "$2" ]; then
              echo "::error::[$1] expected: $2"
              exit 1
            fi
          }

          # 1. Accounting, and no calendar: neither bridge may appear.
          odoo ${ARGS} -d ci_bridges -i account --log-level=warn
          expect "account alone" "SAPIAN-BRIDGE account=installed l10n_et_calendar=uninstalled l10n_et_calendar_account=uninstalled l10n_et_calendar_purchase=uninstalled purchase=uninstalled"

          # 2. Add the calendar: the INVOICE bridge appears by itself, and the
          #    purchase one stays away because purchase is not installed.
          odoo ${ARGS} -d ci_bridges -i l10n_et_calendar --log-level=warn
          expect "calendar added" "SAPIAN-BRIDGE account=installed l10n_et_calendar=installed l10n_et_calendar_account=installed l10n_et_calendar_purchase=uninstalled purchase=uninstalled"

          # 3. Add purchase: now the second bridge appears too.
          odoo ${ARGS} -d ci_bridges -i purchase --log-level=warn
          expect "purchase added" "SAPIAN-BRIDGE account=installed l10n_et_calendar=installed l10n_et_calendar_account=installed l10n_et_calendar_purchase=installed purchase=installed"

          # 4. Uninstall both bridges: their columns go with them, and the
          #    calendar itself is untouched.
          echo 'env["ir.module.module"].search([("name","in",["l10n_et_calendar_account","l10n_et_calendar_purchase"])]).button_immediate_uninstall(); env.cr.commit()' \
            | odoo shell ${ARGS} -d ci_bridges --log-level=warn 2>&1 | tail -3
          echo 'env.cr.execute("SELECT table_name, column_name FROM information_schema.columns WHERE table_name IN (%s, %s)", ("account_move", "purchase_order")); left = sorted(r for r in env.cr.fetchall() if r[1].startswith("l10n_et_")); print("SAPIAN-BRIDGE-UNINST leftover=%d %s" % (len(left), left))' \
            | odoo shell ${ARGS} -d ci_bridges --log-level=warn 2>&1 | tee /tmp/bridge-uninst.log | grep SAPIAN-BRIDGE-UNINST
          grep -q "SAPIAN-BRIDGE-UNINST leftover=0 " /tmp/bridge-uninst.log \
            || { echo "::error::Uninstalling a bridge left its columns behind."; exit 1; }
          expect "bridges removed" "SAPIAN-BRIDGE account=installed l10n_et_calendar=installed l10n_et_calendar_account=uninstalled l10n_et_calendar_purchase=uninstalled purchase=installed"

  theme-with-website:
    name: Theme login vs website
    runs-on: ubuntu-latest
    # WHY A SEPARATE JOB.
    #
    # sapian_theme's login branding is template inheritance on
    # web.login_layout / web.login — layouts other modules also inherit. The
    # `website` module replaces the whole login card at priority 20, and when it
    # is installed our logo and support-contact line silently vanished. The
    # login tests PASSED in CI throughout, because CI never installed website:
    # the guard existed but was never exercised where the breakage happens.
    #
    # A guard that cannot fail in CI is not a guard. This job installs website
    # WITH sapian_theme and runs the login tests against that combination.
    #
    # Separate from integration-tests, not folded into it, for two reasons:
    #   1. it runs in PARALLEL, so the extra ~2 minutes of installing website do
    #      not lengthen the critical path;
    #   2. it is a distinct question with a distinct failure meaning — "the
    #      theme lost a contest with another module" is not "a test broke".
    #
    # This is NOT hypothetical coverage: website_sale is a plausible client
    # purchase (an Ethiopian retailer selling online) and it pulls website in.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Login branding survives `website`
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_theme_website \
            -i website,sapian_theme --without-demo=all \
            --test-enable --test-tags '/sapian_theme:TestSapianThemeLogin,/sapian_theme:TestLoginPageAsAVisitor' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/theme-website.log

          # PROVE THE CONDITION WAS REALLY CREATED. Without this the job could
          # pass by running the login tests on a database where `website` failed
          # to install — green for the same reason the bug was invisible.
          if ! grep -qE "loading website/" /tmp/theme-website.log; then
            echo "::error::No sign that the website module was loaded. This job's whole purpose is testing WITH website installed; it proves nothing otherwise."
            exit 1
          fi

          # Assert the runner reported, and reported the expected suite.
          if ! grep -q "odoo\.tests\.result:" /tmp/theme-website.log; then
            echo "::error::The test runner never reported a result line — no tests were executed."
            exit 1
          fi
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/theme-website.log; then
            echo "::error::Login branding did NOT survive the website module."
            exit 1
          fi

          # A floor, so a renamed or removed test class cannot pass by selecting
          # nothing. TestSapianThemeLogin has 4 tests at this commit and
          # TestLoginPageAsAVisitor 9 — the latter is here because the
          # attribution, the sign-up link and the support line are anchored on
          # the login FORM precisely so they survive `website` replacing the
          # card, and this is the only job that proves it.
          MIN_LOGIN_TESTS=13
          EXECUTED=$(grep -oE "odoo\.tests\.stats: sapian_theme: [0-9]+ tests" /tmp/theme-website.log \
                     | grep -oE "[0-9]+ tests" | grep -oE "^[0-9]+" || echo 0)
          echo "Executed ${EXECUTED} sapian_theme tests with website installed (floor ${MIN_LOGIN_TESTS})"
          if [ "${EXECUTED}" -lt "${MIN_LOGIN_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} tests ran; expected at least ${MIN_LOGIN_TESTS}. The selection is broken, so a green result means nothing."
            exit 1
          fi

  rail-render:
    name: App rail rendered in a browser
    runs-on: ubuntu-latest
    # WHY A SEPARATE JOB — AND WHY IT INSTALLS A BROWSER.
    #
    # The app rail is an OWL component. `/odoo` serves a bootstrap shell, so
    # the rail exists in no HTML any HTTP client can fetch: grepping the page,
    # or the compiled bundle, proves nothing about whether it renders. That is
    # the same gap the login defect hid in — the SCSS said teal, the bundle
    # contained the brand seven times, and the button rendered Odoo purple.
    #
    # So this job drives real headless Chrome. The odoo:19.0 image ships
    # neither Chrome nor websocket-client, and `browser_js` SKIPS when either
    # is missing (odoo/tests/common.py:2153 and :1259) — a skip being a success
    # signal produced by doing nothing. scripts/install_test_browser.sh puts
    # both in place and fails loudly if it cannot, and the assertions at the
    # bottom of this job require the browser's own output in the log, so a
    # silently skipped run cannot come out green.
    #
    # Separate from integration-tests for the same two reasons as
    # theme-with-website: it runs in parallel so the browser install is off the
    # critical path, and "the rail did not render" is a different question from
    # "a test broke".
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install headless Chrome and websocket-client
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/install_test_browser.sh"

      - name: The rail and the backend footer render, and hide below md
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          # Several apps, so the rail has something to be a rail OF. The tests
          # never assert a fixed tile count — the expectation is read per run
          # from /web/webclient/load_menus — so this list can change freely.
          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_rail \
            -i sapian_theme,contacts,crm,project,hr,stock,sale_management,purchase \
            --without-demo=all \
            --test-enable \
            --test-tags '/sapian_theme:TestSapianAppRailRendered,/sapian_theme:TestSapianAppRailOverflow,/sapian_theme:TestSapianAppRailSmallScreen,/sapian_theme:TestAppRailDataOverHttp,/sapian_theme:TestSapianBackendFooterRendered,/sapian_theme:TestSapianBackendFooterSmallScreen,/sapian_theme:TestBackendFooterDataOverHttp' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/rail.log

          if ! grep -q "odoo\.tests\.result:" /tmp/rail.log; then
            echo "::error::The test runner never reported a result line — no tests were executed."
            exit 1
          fi
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/rail.log; then
            echo "::error::The app rail or backend footer tests failed."
            exit 1
          fi

          # THE BROWSER ACTUALLY RAN. Every check above this line is satisfied
          # by a run in which browser_js raised SkipTest and nothing was
          # rendered: no test failed, so nothing failed. These lines are
          # printed by console.log from INSIDE the page, so they cannot be
          # produced by a skip, by a missing browser, or by an empty selection.
          echo "--- what the browser reported ---"
          grep -E "SAPIAN-(RAIL|FOOTER)" /tmp/rail.log | sed 's/^/  /' || true
          for marker in \
            "SAPIAN-RAIL viewport=" \
            "SAPIAN-RAIL-DISCRIMINATION restored -> clean" \
            "SAPIAN-RAIL-OVERFLOW forcedRailHeight=" \
            "SAPIAN-RAIL-SMALL viewport=" \
            "SAPIAN-FOOTER text=" \
            "SAPIAN-FOOTER-DISCRIMINATION removed -> " \
            "SAPIAN-FOOTER-SMALL shown=false"; do
            if ! grep -qF "${marker}" /tmp/rail.log; then
              echo "::error::The browser never reported '${marker}'. The rail tests did not run in a browser — most likely Chrome was missing and browser_js skipped."
              exit 1
            fi
          done

          # And the rail was not empty. A one-app rail would satisfy every
          # assertion above while proving nothing about a real tenant.
          MIN_RAIL_TILES=8
          TILES=$(grep -oE "SAPIAN-RAIL viewport=[^ ]+ apps=[0-9]+ tiles=[0-9]+" /tmp/rail.log \
                  | grep -oE "tiles=[0-9]+" | grep -oE "[0-9]+" | head -1)
          TILES=${TILES:-0}
          echo "Rail tiles rendered: ${TILES} (floor ${MIN_RAIL_TILES})"
          if [ "${TILES}" -lt "${MIN_RAIL_TILES}" ]; then
            echo "::error::The rail rendered ${TILES} tiles; expected at least ${MIN_RAIL_TILES}. The install list did not create the apps this job exists to draw."
            exit 1
          fi
