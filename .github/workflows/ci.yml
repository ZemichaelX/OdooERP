name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-fast-tests:
    name: Lint + reference golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --quiet ruff black pylint pylint-odoo pytest python-dateutil

      - name: Install gitleaks
        # Pinned by version AND checksum: this step's whole job is to detect
        # secrets, so silently fetching a different binary defeats it.
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o /tmp/gitleaks.tar.gz "${url}"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prove the secret scanner discriminates
        # An untested guard is another thing that passes by doing nothing. Plant
        # the exact shape of the leak we actually had and require gitleaks to
        # report it. If this step passes, the scan below means something; if the
        # binary, the config or the rule ever breaks, this fails first and says
        # so, instead of the repo scan quietly finding nothing forever.
        #
        # ASSERT ON THE REPORT, NOT THE EXIT CODE. gitleaks exits non-zero both
        # when it finds a secret and when it PANICS on an unparseable config
        # (RE2 rejects lookahead, and this ruleset was written with one at
        # first). An exit-code check calls the panic a success and then scans
        # nothing for the rest of the repo's life.
        #
        # The planted password is generated here rather than written literally,
        # so no password-shaped string lives in a tracked file — .gitleaks.toml
        # has no path exemptions, and this file is scanned too.
        run: |
          set -euo pipefail
          mkdir -p /tmp/leakcheck/config
          planted="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-32)"
          printf '[options]\nadmin_passwd = %s\n' "${planted}" > /tmp/leakcheck/config/odoo.conf
          gitleaks dir --no-banner --redact --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --report-format json --report-path /tmp/leakcheck-report.json /tmp/leakcheck || true
          if [ ! -f /tmp/leakcheck-report.json ]; then
            echo "::error::gitleaks wrote no report — it did not run (bad config, bad binary). Every scan in this job is meaningless."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          findings = json.load(open("/tmp/leakcheck-report.json"))
          rules = sorted({f["RuleID"] for f in findings})
          print(f"planted-secret scan: {len(findings)} finding(s), rules={rules}")
          if "odoo-admin-passwd" not in rules:
              print("::error::gitleaks did NOT flag a planted admin_passwd. "
                    "The scanner or the odoo-admin-passwd rule is broken, so the repo scan proves nothing.")
              sys.exit(1)
          PY
          echo "Planted secret was detected — the scanner discriminates."

      - name: Scan the working tree for secrets
        # `dir`, not `git`: this asks "does the tree we would ship contain a
        # secret", which is the question a reviewer needs answered on every PR.
        # It deliberately does NOT scan history — the Aug 2026 admin_passwd leak
        # is still in old commits (the value is rotated and dead; the scrub
        # decision is pending on repository visibility, see
        # docs/KICKOFF-engineering-hygiene.md item 1). Scanning history here
        # would pin CI red on a finding no PR can fix.
        #
        # This is a BACKSTOP. The control is .githooks/pre-commit — a check that
        # runs after the commit cannot stop the commit.
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .

      - name: Assert the secret split is intact
        # A direct regression test for the leak that has now happened twice.
        run: |
          set -euo pipefail
          fail=0
          if git ls-files --error-unmatch config/odoo.conf >/dev/null 2>&1; then
            echo "::error::config/odoo.conf is TRACKED again. Secrets belong in the gitignored config/odoo.runtime.conf; the tracked template is config/odoo.conf.example."
            fail=1
          fi
          if ! git ls-files --error-unmatch config/odoo.conf.example >/dev/null 2>&1; then
            echo "::error::config/odoo.conf.example is missing — the scripts create the runtime config from it."
            fail=1
          fi
          if ! grep -qE '^admin_passwd = CHANGEME$' config/odoo.conf.example; then
            echo "::error::config/odoo.conf.example does not ship the CHANGEME placeholder — it may carry a real master password."
            fail=1
          fi
          if git ls-files --error-unmatch config/odoo.runtime.conf >/dev/null 2>&1; then
            echo "::error::config/odoo.runtime.conf is TRACKED. That file holds the live admin_passwd."
            fail=1
          fi
          [ "${fail}" -eq 0 ] && echo "Secret split intact: example tracked with CHANGEME, working files ignored."
          [ "${fail}" -eq 0 ]

      - name: Assert there is something to lint
        # Every check in this job PASSES ON AN EMPTY TREE. Measured, not assumed:
        #   black --check addons        -> exit 0, "No Python files ... Nothing to do"
        #   ruff check addons tests_fast-> exit 0, "warning: No Python files found"
        #   the XML/CSV/manifest step   -> prints "OK" having validated nothing
        # So a renamed, moved or half-checked-out addons/ sails through the whole
        # job green. (pytest is the exception: it exits 5 on zero collected.)
        # Floors are well under the real counts — they catch "the tree is gone",
        # not "someone deleted a file".
        run: |
          set -euo pipefail
          MIN_PY_FILES=80      # 114 at this commit
          MIN_XML_FILES=30     # 46
          MIN_CSV_FILES=5      # 9
          MIN_MANIFESTS=5      # 9
          py=$(find addons tests_fast -name '*.py' | wc -l)
          xml=$(find addons -name '*.xml' | wc -l)
          csv=$(find addons -name '*.csv' | wc -l)
          man=$(find addons -maxdepth 2 -name '__manifest__.py' | wc -l)
          echo "py=${py} (floor ${MIN_PY_FILES})  xml=${xml} (${MIN_XML_FILES})  csv=${csv} (${MIN_CSV_FILES})  manifests=${man} (${MIN_MANIFESTS})"
          fail=0
          [ "${py}"  -ge "${MIN_PY_FILES}"   ] || { echo "::error::Only ${py} Python files found — the source tree is missing, so every lint step below would pass by checking nothing."; fail=1; }
          [ "${xml}" -ge "${MIN_XML_FILES}"  ] || { echo "::error::Only ${xml} XML files found — the validator would report OK having parsed nothing."; fail=1; }
          [ "${csv}" -ge "${MIN_CSV_FILES}"  ] || { echo "::error::Only ${csv} CSV files found — same."; fail=1; }
          [ "${man}" -ge "${MIN_MANIFESTS}"  ] || { echo "::error::Only ${man} manifests found — same."; fail=1; }
          [ "${fail}" -eq 0 ]

      - name: Ruff
        run: ruff check addons tests_fast

      - name: Black
        run: black --check addons

      - name: pylint-odoo
        run: pylint addons

      - name: Reference calculator golden tests (no Odoo needed)
        # pytest exits 5 when it collects NOTHING, so the total-wipe case is
        # already covered. The floor catches the partial one: a renamed test
        # module or a broken import taking most of the suite with it still
        # reports "12 passed" and exits 0.
        run: |
          set -euo pipefail
          MIN_FAST_TESTS=100   # 107 at this commit
          pytest tests_fast/ -q | tee /tmp/fast-tests.log
          passed=$(grep -oE '[0-9]+ passed' /tmp/fast-tests.log | tail -1 | grep -oE '^[0-9]+' || true)
          passed=${passed:-0}
          echo "Fast golden tests passed: ${passed} (floor ${MIN_FAST_TESTS})"
          if [ "${passed}" -lt "${MIN_FAST_TESTS}" ]; then
            echo "::error::Only ${passed} fast tests passed, expected at least ${MIN_FAST_TESTS}. The suite did not run — this is a failure, not a pass."
            exit 1
          fi

      - name: Validate XML, CSV and manifests
        run: |
          python - <<'EOF'
          import ast
          import csv
          import glob
          import xml.etree.ElementTree as ET

          # Count what was actually validated and report it. "OK" printed after
          # looping over an empty glob is a success signal produced by doing
          # nothing — the exact shape this repo keeps getting caught by.
          MIN_XML, MIN_CSV, MIN_MANIFESTS = 30, 5, 5   # 46 / 9 / 9 at this commit

          xml_count = 0
          for path in glob.glob("addons/**/*.xml", recursive=True):
              ET.parse(path)
              xml_count += 1
          csv_count = 0
          for path in glob.glob("addons/**/*.csv", recursive=True):
              with open(path, newline="", encoding="utf-8") as handle:
                  widths = {len(row) for row in csv.reader(handle)}
                  assert len(widths) == 1, f"ragged CSV: {path}"
              csv_count += 1
          manifest_count = 0
          for path in glob.glob("addons/*/__manifest__.py"):
              with open(path, encoding="utf-8") as handle:
                  ast.literal_eval(handle.read())
              manifest_count += 1

          print(f"validated {xml_count} XML, {csv_count} CSV, {manifest_count} manifests")
          assert xml_count >= MIN_XML, f"only {xml_count} XML files validated (floor {MIN_XML})"
          assert csv_count >= MIN_CSV, f"only {csv_count} CSV files validated (floor {MIN_CSV})"
          assert manifest_count >= MIN_MANIFESTS, (
              f"only {manifest_count} manifests validated (floor {MIN_MANIFESTS})"
          )
          print("XML/CSV/manifests OK")
          EOF

  integration-tests:
    name: Odoo integration tests
    runs-on: ubuntu-latest
    # Run inside the same Odoo 19 image production uses, so the suite exercises
    # the real ORM/registry/report stack (A3). A DB failure here fails CI.
    # Images are pinned by DIGEST (R7): the 19.0/16 tags are rebuilt upstream
    # continuously, and an unannounced rebuild silently changed core behaviour
    # under us once already. Upgrading an image is a deliberate, tested change
    # — bump the digest in its own PR and let this suite prove it.
    container:
      image: odoo:19.0@sha256:e415f9924395e7521245813135112f264b9222bcde3b1d3c2ee9ff073081540a
      options: --user root
    services:
      db:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the Odoo integration suites (with demo data)
        # The odoo:19.0 image's default shell is dash (no `pipefail`); force
        # bash, whose GitHub wrapper already runs with `-eo pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/odoo-data
          # Install the two demo tenants: they pull in every product module
          # (sapian_core, l10n_et_base/payroll/reports, vertical_pharma) so
          # --test-enable runs the whole suite. --workers=0 is required for the
          # HttpCase web tests. A failing test makes odoo exit non-zero → CI red.
          odoo \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --addons-path="${GITHUB_WORKSPACE}/addons,/usr/lib/python3/dist-packages/odoo/addons" \
            -d ci_test \
            -i sapian_demo_trader,sapian_demo_pharma,sapian_theme \
            --test-enable \
            --test-tags '/sapian_core,/l10n_et_base,/l10n_et_payroll,/l10n_et_reports,/vertical_pharma,/sapian_demo_trader,/sapian_demo_pharma,/sapian_theme' \
            --workers=0 --max-cron-threads=0 \
            --stop-after-init --log-level=test 2>&1 | tee /tmp/odoo-test.log
          # `set -o pipefail` already makes a non-zero odoo exit fail this step.
          # Belt and braces: also fail on Odoo's own result line reporting any
          # failed or errored test (matches "N failed" or "0 failed, N error(s)"
          # but not the clean "0 failed, 0 error(s)").
          if grep -qE "tests\.result: ([1-9][0-9]* failed|0 failed, [1-9][0-9]* error)" /tmp/odoo-test.log; then
            echo "::error::Odoo integration tests reported failures"
            exit 1
          fi

          # A GREEN EXIT CODE IS NOT PROOF THAT ANYTHING RAN.
          # Every check above this line asks "did a test fail?" — and a run that
          # executes ZERO tests answers "no" to all of them. That is not a
          # hypothetical: it happened locally, where a failed database drop left
          # the modules already installed, so `-i` was a no-op, `--test-enable`
          # had nothing to select, 10 tests ran instead of 222, and the command
          # exited 0. The only tell was an empty stats block. In CI the same
          # shape can come from a renamed module, a typo in --test-tags, or an
          # install that silently does nothing.
          #
          # So assert the positive: the runner reported, and it ran a full suite.
          if ! grep -q "odoo\.tests\.result:" /tmp/odoo-test.log; then
            echo "::error::The Odoo test runner never reported a result line — no tests were executed. A suite that runs nothing must not report success."
            exit 1
          fi
          # MIN_EXPECTED_TESTS is a FLOOR, not the exact count (242 at this
          # commit, after sapian_theme). Raise it as the suite grows. Only ever lower it in a commit
          # that says which tests went away and why — lowering it to make CI
          # pass is how this guard gets quietly disabled.
          MIN_EXPECTED_TESTS=220
          EXECUTED=$(grep -oE "odoo\.tests\.stats: [A-Za-z0-9_]+: [0-9]+ tests" /tmp/odoo-test.log \
                     | awk '$4 == "tests" { total += $3 } END { print total + 0 }')
          echo "Executed ${EXECUTED} tests (floor ${MIN_EXPECTED_TESTS}):"
          grep -oE "odoo\.tests\.stats: [A-Za-z0-9_]+: [0-9]+ tests" /tmp/odoo-test.log | sed 's/^/  /'
          if [ "${EXECUTED}" -lt "${MIN_EXPECTED_TESTS}" ]; then
            echo "::error::Only ${EXECUTED} tests executed, expected at least ${MIN_EXPECTED_TESTS}. The suite did not run — this is a failure, not a pass."
            exit 1
          fi
