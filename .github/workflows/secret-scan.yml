name: Secret scan

# THIS CHECK IS ADVISORY. It cannot block a merge, and must not be described as
# if it could.
#
# The repository is private on the GitHub FREE plan: rulesets require Team and
# classic branch protection requires Pro, so required status checks are simply
# unavailable. This job runs on every push and every pull request and turns red
# on a finding, but a red check on Free is a notification. Anyone can merge past
# it.
#
# What that means in practice:
#   - .githooks/pre-commit is the only thing that can PREVENT a secret. It is
#     per-clone (core.hooksPath cannot be committed), so it must be installed and
#     verified on every machine — see the README.
#   - This job is the ALARM. A red gitleaks check means a secret is already in
#     the repository: ROTATE IT. Fixing the diff is not enough.
#
# Kept a SEPARATE workflow from ci.yml for two reasons:
#   1. a stable, single-purpose check name — ready to require immediately if the
#      plan ever moves to Pro/Team;
#   2. it must not be cancellable by an unrelated earlier step failing in a
#      shared job — a secret scan that dies because the linter was unhappy is a
#      secret scan that did not run.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        # Pinned by version AND checksum: this job's whole purpose is detecting
        # secrets, so silently fetching a different binary defeats it.
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o /tmp/gitleaks.tar.gz "${url}"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prove the scanner discriminates
        # An untested guard is another thing that passes by doing nothing. Plant
        # the exact shape of the leak we actually had and require gitleaks to
        # REPORT it before any clean result below is believed.
        #
        # ASSERT ON THE REPORT, NOT THE EXIT CODE. gitleaks exits non-zero both
        # when it finds a secret and when it PANICS on an unparseable config
        # (RE2 rejects lookahead, and this ruleset was written with one at
        # first). An exit-code check reads the panic as "secret found" and then
        # scans nothing for the rest of the repo's life.
        #
        # The planted password is generated here rather than written literally,
        # so no password-shaped string lives in a tracked file — .gitleaks.toml
        # has no path exemptions, and this file is scanned too.
        run: |
          set -euo pipefail
          mkdir -p /tmp/leakcheck/config
          planted="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-32)"
          printf '[options]\nadmin_passwd = %s\n' "${planted}" > /tmp/leakcheck/config/odoo.conf
          gitleaks dir --no-banner --redact --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --report-format json --report-path /tmp/leakcheck-report.json /tmp/leakcheck || true
          if [ ! -f /tmp/leakcheck-report.json ]; then
            echo "::error::gitleaks wrote no report — it did not run (bad config, bad binary). Every scan in this job is meaningless."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          findings = json.load(open("/tmp/leakcheck-report.json"))
          rules = sorted({f["RuleID"] for f in findings})
          print(f"planted-secret scan: {len(findings)} finding(s), rules={rules}")
          if "odoo-admin-passwd" not in rules:
              print("::error::gitleaks did NOT flag a planted admin_passwd. The scanner "
                    "or the odoo-admin-passwd rule is broken, so the repo scan proves nothing.")
              sys.exit(1)
          PY

      - name: Scan the working tree
        # `dir`, not `git`: this asks "does the tree we would ship contain a
        # secret", which is the question every push and PR needs answered.
        #
        # It deliberately does NOT scan history. The Aug 2026 admin_passwd is
        # still in old commits; the value is dead (rotated twice) and the scrub
        # is scheduled once the open PRs land. Scanning history here would pin
        # this check red on a finding no PR can fix, and a permanently red
        # required check is a check everyone learns to route around.
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .

      - name: Assert the secret split is intact
        # A direct regression test for the leak that has now happened twice, and
        # a second, independent layer: it fires even if a value somehow slips
        # past the pattern rules, because it checks the placeholder is still
        # there rather than checking what replaced it.
        run: |
          set -euo pipefail
          fail=0
          if git ls-files --error-unmatch config/odoo.conf >/dev/null 2>&1; then
            echo "::error::config/odoo.conf is TRACKED again. Secrets belong in the gitignored config/odoo.runtime.conf; the tracked template is config/odoo.conf.example."
            fail=1
          fi
          if ! git ls-files --error-unmatch config/odoo.conf.example >/dev/null 2>&1; then
            echo "::error::config/odoo.conf.example is missing — the ops scripts create the runtime config from it."
            fail=1
          fi
          if ! grep -qE '^admin_passwd = CHANGEME$' config/odoo.conf.example; then
            echo "::error::config/odoo.conf.example no longer ships the CHANGEME placeholder — it may carry a real master password."
            fail=1
          fi
          if git ls-files --error-unmatch config/odoo.runtime.conf >/dev/null 2>&1; then
            echo "::error::config/odoo.runtime.conf is TRACKED. That file holds the live admin_passwd."
            fail=1
          fi
          [ "${fail}" -eq 0 ] && echo "Secret split intact: example tracked with CHANGEME, working files ignored."
          [ "${fail}" -eq 0 ]
